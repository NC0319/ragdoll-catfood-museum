  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');

  // Background
  const grad = ctx.createLinearGradient(0,0,0,128);
  grad.addColorStop(0, '#f5ead0');
  grad.addColorStop(0.5, '#ede0c8');
  grad.addColorStop(1, '#e8d5b8');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,256,128);

  // Accent band
  const accentHex = '#' + food.accent.toString(16).padStart(6,'0');
  ctx.fillStyle = accentHex;
  ctx.fillRect(0, 85, 256, 20);

  // Brand
  ctx.fillStyle = '#3d2e25';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(food.brand.split(' ')[0], 128, 30);

  // Name
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText(food.name, 128, 50);

  // Stage
  const sm = STAGE_META[food.stageKey];
  ctx.fillStyle = accentHex;
  ctx.font = 'bold 10px sans-serif';
  ctx.fillText(sm.name, 128, 70);

  // Protein
  ctx.fillStyle = '#3d2e25';
  ctx.font = 'bold 9px sans-serif';
  ctx.fillText('P'+food.protein+' F'+food.fat, 128, 115);

  return new THREE.CanvasTexture(c);
}

const cans = [];
let foodIdx = 0;

for (let row = 0; row < 5; row++) {
  for (let col = 0; col < 4; col++) {
    const food = FOODS[foodIdx];
    if (!food) break;
    foodIdx++;

    const canGroup = new THREE.Group();

    // Can body
    const bodyGeo = new THREE.CylinderGeometry(CAN_R, CAN_R, CAN_H, 32, 1, true);
    const labelTex = createCanLabelTexture(food);
    labelTex.wrapS = THREE.RepeatWrapping;
    labelTex.repeat.x = 1;
    labelTex.offset.x = 0.5;
    const bodyMat = new THREE.MeshStandardMaterial({
      map: labelTex,
      roughness: 0.4,
      metalness: 0.1
    });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    canGroup.add(body);

    // Top cap
    const capMat = new THREE.MeshStandardMaterial({color:0xc4b090, roughness:0.3, metalness:0.3});
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(CAN_R*0.95, CAN_R*0.95, 0.1, 32), capMat);
    cap.position.y = CAN_H/2 + 0.05;
    canGroup.add(cap);

    // Bottom
    const bottom = new THREE.Mesh(new THREE.CylinderGeometry(CAN_R*0.95, CAN_R*0.95, 0.08, 32), capMat);
    bottom.position.y = -CAN_H/2 - 0.04;
    canGroup.add(bottom);

    // Position
    canGroup.position.set(COL_X[col], SHELF_Y[row], SHELF_Z);
    canGroup.userData = { food, row, col, originalY: SHELF_Y[row], originalZ: SHELF_Z };
    canGroup.castShadow = true;

    scene.add(canGroup);
    cans.push(canGroup);
  }
}

// ═══ Glow rings (for selection) ═══
function createGlowRing(color) {
  const geo = new THREE.RingGeometry(CAN_R * 1.3, CAN_R * 1.6, 32);
  const mat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:0, side:THREE.DoubleSide});
  const ring = new THREE.Mesh(geo, mat);
  ring.rotation.x = -Math.PI/2;
  return ring;
}
cans.forEach(c => {
  const ring = createGlowRing(c.userData.food.accent);
  ring.position.set(c.position.x, c.userData.originalY - CAN_H/2 - 0.12, c.position.z);
  scene.add(ring);
  c.userData.ring = ring;
});

// ═══ Interaction ═══
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredCan = null;
let selectedCan = null;
let focusedMode = false;
let cameraAnimating = false;

function onPointerMove(e) {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;

  if (focusedMode) return;

  raycaster.setFromCamera(mouse, camera);
  const meshes = cans.flatMap(c => c.children);
  const hits = raycaster.intersectObjects(meshes);

  let foundCan = null;
  if (hits.length > 0) {
    // Walk up to find the group
    let obj = hits[0].object;
    while (obj && !obj.userData.food) obj = obj.parent;
    if (obj && !obj.userData.dimmed) foundCan = obj;
  }

  if (hoveredCan && hoveredCan !== foundCan) {
    hoveredCan.scale.setScalar(1);
    hoveredCan.userData.ring.material.opacity = 0;
  }
  hoveredCan = foundCan;
  if (hoveredCan) {
    hoveredCan.scale.setScalar(1.08);
    hoveredCan.userData.ring.material.opacity = 0.4;
    document.body.style.cursor = 'pointer';
  } else {
    document.body.style.cursor = 'default';
  }
}

let downPos = {x:0, y:0};
function onPointerDown(e) {
  downPos = {x: e.clientX, y: e.clientY};
}
function onPointerUp(e) {
  const dx = Math.abs(e.clientX - downPos.x);
  const dy = Math.abs(e.clientY - downPos.y);
  if (dx > 6 || dy > 6) return; // drag, not click

  if (focusedMode) return;

  raycaster.setFromCamera(mouse, camera);
  const meshes = cans.flatMap(c => c.children);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj && !obj.userData.food) obj = obj.parent;
    if (obj && !obj.userData.dimmed) focusCan(obj);
  }
}

window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', onPointerUp);

// ═══ Focus animation ═══
function focusCan(can) {
  selectedCan = can;
  focusedMode = true;
  controls.enabled = false;
  document.getElementById('back-btn').classList.add('show');

  // Dim others
  cans.forEach(c => {
    if (c !== can) {
      c.userData.dimmed = true;
      c.children.forEach(ch => {
        if (ch.material) {
          if (ch.material.map) ch.material.opacity = 0.15;
          else ch.material.opacity = 0.15;
          ch.material.transparent = true;
        }
      });
    }
  });

  // Animate camera closer
  const targetPos = new THREE.Vector3(can.position.x * 0.3, can.position.y + 0.5, can.position.z + 4.5);
  animateCamera(targetPos, can.position, 800);

  // Show detail
  showDetail(can.userData.food);
}

function unfocus() {
  if (!selectedCan) return;
  focusedMode = false;
  controls.enabled = true;
  document.getElementById('back-btn').classList.remove('show');
  document.getElementById('detail').classList.remove('show');

  // Restore cans
  cans.forEach(c => {
    c.userData.dimmed = false;
    c.children.forEach(ch => {
      if (ch.material) {
        ch.material.opacity = 1;
        ch.material.transparent = false;
      }
    });
    c.scale.setScalar(1);
    c.userData.ring.material.opacity = 0;
  });

  selectedCan = null;
  animateCamera(CAM_INIT, CAM_LOOK, 800);
}

function animateCamera(toPos, toTarget, duration) {
  cameraAnimating = true;
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const start = performance.now();

  function step() {
    const t = Math.min((performance.now() - start) / duration, 1);
    const e = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; // easeInOutQuad
    camera.position.lerpVectors(fromPos, toPos, e);
    controls.target.lerpVectors(fromTarget, toTarget, e);
    controls.update();
    if (t < 1) requestAnimationFrame(step);
    else cameraAnimating = false;
  }
  step();
}

// ═══ Detail Panel ═══
function showDetail(food) {
  const sm = STAGE_META[food.stageKey];
  const accentHex = '#' + food.accent.toString(16).padStart(6,'0');
  const panel = document.getElementById('detail');
  const inner = document.getElementById('detail-inner');

  inner.innerHTML = `
    <div class="dh">
      <div class="dh-icon" style="background:${accentHex}">${sm.icon}</div>
      <div>
        <h2>${food.name}</h2>
        <p>${food.brand} · ${food.origin}</p>
        <span class="dh-tag" style="background:${accentHex}">${food.stage}</span>
      </div>
    </div>
    <div class="dn">
      <div class="dn-card"><span class="dn-label">粗蛋白</span><span class="dn-val" style="color:${accentHex}">${food.protein}</span></div>
      <div class="dn-card"><span class="dn-label">粗脂肪</span><span class="dn-val" style="color:${accentHex}">${food.fat}</span></div>
      <div class="dn-card"><span class="dn-label">阶段</span><span class="dn-val" style="color:${accentHex};font-size:.8rem">${sm.name}</span></div>
    </div>
    <div class="d-fit"><span>🎯</span><span>${food.fit}</span></div>
    <div class="d-pc">
      <div class="d-pros"><h4>✅ 优点</h4><ul>${food.pros.map(p=>`<li>${p}</li>`).join('')}</ul></div>
      <div class="d-cons"><h4>⚠️ 注意</h4><ul>${food.cons.map(c=>`<li>${c}</li>`).join('')}</ul></div>
    </div>
  `;

  setTimeout(() => panel.classList.add('show'), 100);
}

document.getElementById('detail-close').addEventListener('click', unfocus);
document.getElementById('back-btn').addEventListener('click', unfocus);
document.addEventListener('keydown', e => { if (e.key === 'Escape') unfocus(); });

// ═══ Filter ═══
let currentFilter = 'all';

function applyFilter(key) {
  currentFilter = key;
  cans.forEach(c => {
    const food = c.userData.food;
    const match = key === 'all' || food.stageKey === key ||
      (key === 'senior' && c.userData.row === 3 && c.userData.col < 2) ||
      (key === 'raw' && c.userData.row === 3 && c.userData.col >= 2);
    c.userData.dimmed = !match && !focusedMode;
    c.children.forEach(ch => {
      if (ch.material) {
        if (!focusedMode || c === selectedCan) {
          ch.material.opacity = match ? 1 : 0.15;
          ch.material.transparent = !match;
        }
      }
    });
  });

  // Update pills
  document.querySelectorAll('.fp').forEach(p => {
    p.classList.toggle('active', p.dataset.filter === key);
  });

  // Update stage labels
  document.querySelectorAll('.sl').forEach(s => {
    s.classList.toggle('active', s.dataset.stage === key);
  });
}

// Build filter pills
const filtersEl = document.getElementById('filters');
const filterOptions = [
  {key:'all', label:'全部', color:'#d4a574'},
  {key:'kitten', label:'幼猫', color:STAGE_META.kitten.hex},
  {key:'adult', label:'成猫', color:STAGE_META.adult.hex},
  {key:'special', label:'功能型', color:STAGE_META.special.hex},
  {key:'senior', label:'老年', color:STAGE_META.senior.hex},
  {key:'raw', label:'冻干', color:STAGE_META.raw.hex},
  {key:'domestic', label:'国货', color:STAGE_META.domestic.hex}
];
filtersEl.innerHTML = filterOptions.map(f =>
  `<button class="fp" data-filter="${f.key}"><span class="dot" style="background:${f.color}"></span>${f.label}</button>`
).join('');
filtersEl.querySelectorAll('.fp').forEach(btn => {
  btn.addEventListener('click', () => applyFilter(btn.dataset.filter));
});

// Build stage labels
const stageLabelsEl = document.getElementById('stage-labels');
stageLabelsEl.innerHTML = ROW_LABELS.map((r, i) => {
  const meta = STAGE_META[r.key] || {hex:'#b07060'};
  if (r.key === 'mixed') meta = {hex:'#b07060'};
  return `<div class="sl" data-stage="${r.key}" style="--c:${meta.hex}">${r.label}</div>`;
}).join('');
stageLabelsEl.querySelectorAll('.sl').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.stage === 'kitten') applyFilter('kitten');
    else if (btn.dataset.stage === 'adult') applyFilter('adult');
    else if (btn.dataset.stage === 'special') applyFilter('special');
    else if (btn.dataset.stage === 'domestic') applyFilter('domestic');
    else applyFilter('all');
  });
});

// ═══ Animation Loop ═══
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.016;

  // Breathing spotlight
  topLight.intensity = 2.0 + Math.sin(time * 0.8) * 0.5;

  // Selected can: float + rotate + glow
  if (selectedCan && focusedMode) {
    selectedCan.position.y = selectedCan.userData.originalY + Math.sin(time * 1.5) * 0.08;
    selectedCan.rotation.y += 0.015;
    selectedCan.userData.ring.material.opacity = 0.5 + Math.sin(time * 2) * 0.2;
    selectedCan.userData.ring.scale.setScalar(1 + Math.sin(time * 2) * 0.1);
  }

  // Hovered can subtle rotate
  if (hoveredCan && !focusedMode) {
    hoveredCan.rotation.y += 0.01;
  }

  controls.update();
  renderer.render(scene, camera);
}

// ═══ Resize ═══
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ═══ Start ═══
animate();
document.getElementById('loading').classList.add('hide');
setTimeout(() => document.getElementById('loading').remove(), 800);
