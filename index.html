<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>布偶猫猫粮3D展览馆</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#8b5cf6;--purple-dark:#6d28d9;--purple-light:#a78bfa;
  --orange:#f97316;--pink:#ec4899;--teal:#14b8a6;--yellow:#eab308;
  --warm-bg:#f8f3ee;--card-bg:#fff;--text:#1e1b4b;--text-muted:#6b7280;
  --shadow:0 4px 24px rgba(139,92,246,.12);--radius:20px;
}
html,body{font-family:'PingFang SC','Helvetica Neue',Arial,sans-serif;background:var(--warm-bg);color:var(--text);overflow-x:hidden}

/* ── 通用隐藏 ── */
.hidden{display:none!important}

/* ══════════════════════════════════════
   SCREEN 1: HOME
══════════════════════════════════════ */
#home-screen{
  min-height:100vh;
  display:flex;flex-direction:column;
  position:relative;
  overflow:hidden;
}

/* Blob 背景 */
.blob-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
}
.blob-bg::before,.blob-bg::after,.blob-bg .b3,.blob-bg .b4{
  content:'';position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;
  animation:blobFloat 18s ease-in-out infinite;
}
.blob-bg::before{width:600px;height:600px;background:#fde68a;top:-200px;right:-100px;animation-delay:0s}
.blob-bg::after{width:500px;height:500px;background:#fdba74;bottom:-100px;left:-150px;animation-delay:-6s}
.blob-bg .b3{width:400px;height:400px;background:#c4b5fd;top:40%;left:-100px;animation-delay:-12s}
.blob-bg .b4{width:350px;height:350px;background:#fbcfe8;top:20%;right:10%;animation-delay:-3s;opacity:.25}
@keyframes blobFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(30px,-40px) scale(1.05)}
  50%{transform:translate(-20px,30px) scale(.95)}
  75%{transform:translate(40px,20px) scale(1.02)}
}

/* 顶部导航 */
.home-nav{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;padding-top:max(16px,env(safe-area-inset-top));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:rgba(248,243,238,.7);
}
.nav-logo{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  font-weight:800;font-size:18px;letter-spacing:-.5px;
}
.nav-logo span{font-size:22px;-webkit-text-fill-color:initial}
.nav-actions{display:flex;gap:8px}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:rgba(139,92,246,.1);color:var(--purple);font-size:18px;
  transition:.2s;
}
.icon-btn:hover{background:rgba(139,92,246,.2);transform:scale(1.05)}

/* Hero 区域 */
.home-hero{
  position:relative;z-index:5;
  padding:40px 24px 24px;
  text-align:center;
}
.home-hero h1{
  font-size:clamp(28px,6vw,48px);font-weight:800;line-height:1.15;
  background:linear-gradient(135deg,#4c1d95,#7c3aed,#c026d3);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:12px;
}
.home-hero p{color:var(--text-muted);font-size:15px;margin-bottom:24px}
.home-hero .hero-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#ede9fe,#fce7f3);
  border:1px solid rgba(139,92,246,.2);
  border-radius:30px;padding:6px 16px;font-size:13px;color:var(--purple-dark);
  font-weight:600;
}

/* 首页 3D 预览罐 */
.home-can-hero{
  position:relative;z-index:5;
  display:flex;justify-content:center;padding:8px 24px 16px;
}
#hero-canvas-wrap{
  width:180px;height:180px;position:relative;
  background:radial-gradient(circle,#fff 0%,rgba(139,92,246,.05) 100%);
  border-radius:50%;
}
#hero-canvas-wrap canvas{width:100%!important;height:100%!important;border-radius:50%}

/* 首页缩略商品列表 */
.home-products{
  position:relative;z-index:5;
  padding:0 24px 32px;
}
.home-products-label{
  font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:14px;
}
.home-prod-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
}
.home-prod-card{
  background:var(--card-bg);border-radius:16px;padding:12px;
  box-shadow:var(--shadow);cursor:pointer;
  transition:transform .25s,box-shadow .25s;
  position:relative;overflow:hidden;
}
.home-prod-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(139,92,246,.2)}
.home-prod-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--purple),var(--pink));
  border-radius:16px 16px 0 0;
}
.home-prod-mini-canvas{width:100%;aspect-ratio:1;border-radius:10px;background:#fafafa}
.home-prod-mini-canvas canvas{width:100%!important;height:100%!important;border-radius:10px}
.home-prod-name{
  font-size:11px;font-weight:600;margin-top:8px;line-height:1.3;
  color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.home-prod-price{font-size:11px;color:var(--orange);font-weight:700;margin-top:4px}
.home-prod-add{
  position:absolute;top:8px;right:8px;
  width:24px;height:24px;border-radius:50%;border:none;
  background:var(--purple);color:#fff;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:.2s;
}
.home-prod-card:hover .home-prod-add{opacity:1}

/* 底部胶囊工具栏 */
.bottom-toolbar{
  position:fixed;bottom:max(16px,env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);
  z-index:100;
  background:rgba(30,27,75,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:30px;padding:8px;
  display:flex;align-items:center;gap:4px;
  box-shadow:0 8px 32px rgba(0,0,0,.25);
}
.toolbar-btn{
  border:none;background:transparent;color:rgba(255,255,255,.6);
  font-size:12px;font-weight:600;padding:8px 16px;border-radius:22px;cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:.2s;white-space:nowrap;
}
.toolbar-btn.active{background:rgba(255,255,255,.15);color:#fff}
.toolbar-btn:hover{color:#fff}
.toolbar-btn .tb-icon{font-size:16px}

/* 右下抽屉图标 */
.floating-drawer-btn{
  position:fixed;bottom:max(80px,calc(16px + env(safe-area-inset-bottom) + 60px));
  right:20px;z-index:99;
  width:48px;height:48px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(139,92,246,.4);
  transition:.2s;
}
.floating-drawer-btn:hover{transform:scale(1.1)}

/* ══════════════════════════════════════
   SCREEN 2: BROWSE
══════════════════════════════════════ */
#browse-screen{
  min-height:100vh;
  display:flex;flex-direction:column;
  background:linear-gradient(160deg,#fff 0%,#fff7ed 60%,#fce7f3 100%);
  padding-bottom:80px;
}

.browse-nav{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;padding-top:max(14px,env(safe-area-inset-top));
  background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(139,92,246,.1);
}
.back-btn{
  width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(139,92,246,.2);
  background:transparent;color:var(--purple);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.browse-title{flex:1;font-weight:700;font-size:17px;text-align:center}
.browse-cart{
  width:36px;height:36px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--orange),#fb923c);
  color:#fff;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.cart-badge{
  position:absolute;top:-4px;right:-4px;
  background:#ef4444;color:#fff;font-size:9px;font-weight:700;
  width:16px;height:16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}

/* 橙黄 Banner */
.browse-banner{
  background:linear-gradient(135deg,#f97316,#fb923c);
  margin:16px 20px;border-radius:20px;padding:20px 20px 16px;
  color:#fff;position:relative;overflow:hidden;
}
.browse-banner::after{
  content:'';position:absolute;right:-20px;top:-20px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.15);
}
.browse-banner-eyebrow{font-size:11px;opacity:.85;letter-spacing:.5px;text-transform:uppercase}
.browse-banner h2{font-size:22px;font-weight:800;line-height:1.2;margin:4px 0 8px}
.browse-banner p{font-size:13px;opacity:.85}
.browse-banner-tag{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.25);border-radius:20px;
  padding:4px 10px;font-size:11px;margin-top:10px;
}

/* 筛选标签 */
.filter-tabs{
  display:flex;gap:8px;overflow-x:auto;padding:16px 20px 4px;
  scrollbar-width:none;
}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{
  flex-shrink:0;border:none;border-radius:20px;padding:7px 16px;
  font-size:13px;font-weight:600;cursor:pointer;
  background:rgba(139,92,246,.08);color:var(--purple);
  border:1.5px solid transparent;transition:.2s;
}
.filter-tab.active{
  background:var(--purple);color:#fff;border-color:var(--purple);
}
.filter-tab:hover:not(.active){border-color:var(--purple)}

/* 商品计数行 */
.browse-count-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 20px 12px;font-size:12px;color:var(--text-muted);
}
.sort-btn{
  display:flex;align-items:center;gap:4px;
  border:none;background:transparent;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;
}

/* 商品卡片网格 */
.prod-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;padding:0 20px 20px;
}

/* 每个商品卡片 */
.prod-card{
  background:var(--card-bg);border-radius:18px;overflow:hidden;
  box-shadow:0 2px 16px rgba(0,0,0,.06);
  cursor:pointer;transition:transform .25s,box-shadow .25s;
  position:relative;
}
.prod-card:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(0,0,0,.1)}
.prod-card-accent{
  position:absolute;top:0;left:0;right:0;height:5px;
  border-radius:18px 18px 0 0;
}

/* 3D 罐头 Canvas */
.prod-canvas-wrap{
  width:100%;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.prod-canvas-wrap canvas{width:85%!important;height:85%!important}

/* 悬浮时 3D 罐子抖动动画 */
.prod-card:hover .prod-canvas-wrap canvas{
  animation:canFloat 0.8s ease-in-out;
}
@keyframes canFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-6px) rotate(-3deg)}
  75%{transform:translateY(-3px) rotate(3deg)}
}

.prod-card-body{padding:10px 10px 12px}
.prod-card-brand{font-size:10px;color:var(--text-muted);font-weight:600;letter-spacing:.3px}
.prod-card-name{
  font-size:12px;font-weight:700;line-height:1.3;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.prod-card-bottom{
  display:flex;align-items:center;justify-content:space-between;margin-top:8px;
}
.prod-card-price{font-size:13px;font-weight:800;color:var(--orange)}
.prod-card-add{
  width:26px;height:26px;border-radius:50%;border:none;
  background:var(--purple);color:#fff;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;
}
.prod-card-add:hover{transform:scale(1.15)}

/* 侧边竖排文字 */
.scroll-hint{
  position:fixed;left:8px;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;font-size:10px;color:var(--text-muted);letter-spacing:1px;
  opacity:.5;z-index:5;
}
.follow-hint{
  position:fixed;right:8px;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;font-size:10px;color:var(--text-muted);letter-spacing:1px;
  opacity:.5;z-index:5;
}

/* ══════════════════════════════════════
   SCREEN 3: DETAIL
══════════════════════════════════════ */
#detail-screen{
  min-height:100vh;
  display:flex;flex-direction:column;
  background:linear-gradient(170deg,#eff6ff 0%,#f0fdf4 50%,#faf5ff 100%);
  padding-bottom:100px;
}

.detail-nav{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;padding-top:max(14px,env(safe-area-inset-top));
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.detail-nav-title{font-weight:700;font-size:16px}
.detail-nav-actions{display:flex;gap:8px}

/* 圆点装饰 */
.detail-dots{
  position:absolute;top:70px;right:20px;
  display:grid;grid-template-columns:repeat(4,6px);gap:8px;opacity:.3;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--purple)}

/* 紫色大卡 */
.detail-main-card{
  margin:16px 20px;border-radius:24px;overflow:hidden;
  background:linear-gradient(145deg,#7c3aed,#a855f7);
  color:#fff;position:relative;padding:20px;
}
.detail-main-card::before{
  content:'';position:absolute;top:-60px;right:-40px;
  width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.dc-360-btn{
  position:absolute;top:16px;right:16px;
  width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.15);color:#fff;font-size:12px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}

/* 3D 罐头 Canvas 在大卡中 */
.detail-canvas-wrap{
  width:180px;height:180px;margin:0 auto 16px;
  position:relative;
}
.detail-canvas-wrap canvas{width:100%!important;height:100%!important}

.dc-brand{font-size:12px;opacity:.8;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.dc-name{font-size:20px;font-weight:800;line-height:1.2;margin:4px 0 8px}
.dc-origin{font-size:13px;opacity:.75}

.dc-price-row{
  display:flex;align-items:center;gap:12px;margin:12px 0;
}
.dc-price{font-size:28px;font-weight:800}
.dc-unit{font-size:13px;opacity:.75}

.dc-stars{
  display:flex;gap:2px;font-size:14px;color:#fde047;
}
.dc-star-half{position:relative;display:inline-block}
.dc-reviews{font-size:11px;opacity:.7;margin-left:6px}

.dc-color-picker{
  display:flex;gap:6px;margin:12px 0;
}
.dc-color-dot{
  width:18px;height:18px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:.2s;
}
.dc-color-dot.active{border-color:#fff;transform:scale(1.2)}

.dc-size-btns{display:flex;gap:6px;flex-wrap:wrap}
.dc-size-btn{
  border:none;border-radius:12px;padding:6px 14px;
  font-size:12px;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,.2);color:#fff;
  transition:.2s;
}
.dc-size-btn.active{background:#fff;color:var(--purple-dark)}

/* 数量选择器 */
.dc-qty{
  display:flex;align-items:center;gap:12px;margin:12px 0;
}
.qty-btn{
  width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);
  background:transparent;color:#fff;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.qty-num{font-size:18px;font-weight:700;min-width:24px;text-align:center}
.dc-add-cart-btn{
  width:100%;border:none;border-radius:16px;padding:14px;
  background:#fff;color:var(--purple-dark);font-size:15px;font-weight:800;
  cursor:pointer;margin-top:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  transition:.2s;
}
.dc-add-cart-btn:hover{transform:scale(1.02)}

/* 规格列表 */
.detail-specs{
  margin:16px 20px;
  background:var(--card-bg);border-radius:20px;padding:16px;
  box-shadow:var(--shadow);
}
.specs-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text)}
.spec-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid #f3f4f6;
}
.spec-row:last-child{border-bottom:none}
.spec-label{font-size:13px;color:var(--text-muted)}
.spec-value{font-size:13px;font-weight:700;color:var(--text)}

/* 优点/注意 */
.detail-pros-cons{
  margin:0 20px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.dpc-card{
  background:var(--card-bg);border-radius:16px;padding:14px;
  box-shadow:var(--shadow);
}
.dpc-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:4px}
.dpc-title.pros{color:#16a34a}
.dpc-title.cons{color:#dc2626}
.dpc-list{list-style:none}
.dpc-list li{font-size:12px;color:var(--text-muted);padding:3px 0;line-height:1.4}

/* 预览卡片（右侧/下方） */
.detail-previews{
  margin:16px 20px 0;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.preview-card{
  background:var(--card-bg);border-radius:14px;padding:10px;
  box-shadow:var(--shadow);cursor:pointer;transition:.2s;
}
.preview-card:hover{transform:scale(1.03)}
.preview-canvas{width:100%;aspect-ratio:1}
.preview-canvas canvas{width:100%!important;height:100%!important}
.preview-name{font-size:11px;font-weight:600;margin-top:6px;line-height:1.3;text-align:center}
.preview-price{font-size:12px;font-weight:800;color:var(--orange);text-align:center;margin-top:2px}
.preview-add{
  display:block;width:100%;margin-top:6px;
  border:none;border-radius:10px;padding:5px;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  color:#fff;font-size:11px;font-weight:700;cursor:pointer;
}

/* 底部导航栏 */
.detail-bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  padding:12px 20px max(12px,env(safe-area-inset-bottom));
  background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,0,0,.06);
  display:flex;align-items:center;gap:12px;
  z-index:50;
}
.detail-back-btn{
  border:none;border-radius:14px;padding:12px 20px;
  background:#f3f4f6;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
}
.detail-buy-btn{
  flex:1;border:none;border-radius:14px;padding:12px;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  color:#fff;font-size:14px;font-weight:800;cursor:pointer;
}

/* 加载状态 */
.loading-overlay{
  position:fixed;inset:0;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(248,243,238,.95);
}
.loading-cat{font-size:64px;animation:catBounce 1s ease-in-out infinite}
@keyframes catBounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-16px)}
}
.loading-text{font-size:14px;color:var(--text-muted);margin-top:16px;font-weight:600}
.loading-bar{
  width:160px;height:4px;background:#e5e7eb;border-radius:2px;margin-top:12px;overflow:hidden;
}
.loading-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));
  border-radius:2px;animation:loadingBar 1.5s ease-in-out infinite;
}
@keyframes loadingBar{
  0%{width:0%;margin-left:0%}
  50%{width:60%;margin-left:20%}
  100%{width:0%;margin-left:100%}
}

/* 响应式 */
@media(max-width:480px){
  .home-prod-grid{grid-template-columns:repeat(2,1fr)}
  .prod-grid{grid-template-columns:repeat(2,1fr)}

// 创建 3D 罐头
function createCan3D(canvas, food) {
  const W = canvas.clientWidth || 150;
  const H = canvas.clientHeight || 150;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(W, H, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = null;

  const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
  camera.position.set(0, 0.5, 5);
  camera.lookAt(0, 0, 0);

  // 光照
  const ambient = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
  dirLight.position.set(3, 5, 3);
  dirLight.castShadow = true;
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0xe0e8ff, 0.4);
  fillLight.position.set(-3, 2, -2);
  scene.add(fillLight);

  // 罐头组
  const group = new THREE.Group();
  scene.add(group);

  // 解析颜色
  const bodyColor = new THREE.Color(food.body || '#f5ead0');
  const accentColor = new THREE.Color(food.accent || '#c4915c');
  const metalColor = new THREE.Color('#d4d0c8');

  // 罐身主体（圆筒）
  const bodyGeo = new THREE.CylinderGeometry(0.55, 0.55, 1.2, 32);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: bodyColor, roughness: 0.4, metalness: 0.1
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  // 顶部金属盖
  const topGeo = new THREE.CylinderGeometry(0.56, 0.56, 0.08, 32);
  const topMat = new THREE.MeshStandardMaterial({
    color: metalColor, roughness: 0.2, metalness: 0.8
  });
  const top = new THREE.Mesh(topGeo, topMat);
  top.position.y = 0.64;
  top.castShadow = true;
  group.add(top);

  // 顶部拉环
  const ringGeo = new THREE.TorusGeometry(0.12, 0.025, 8, 16, Math.PI * 1.5);
  const ringMat = new THREE.MeshStandardMaterial({ color: metalColor, roughness: 0.2, metalness: 0.9 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.set(0, 0.72, 0.1);
  ring.rotation.x = -0.3;
  group.add(ring);

  // 底部边缘
  const botGeo = new THREE.CylinderGeometry(0.56, 0.52, 0.06, 32);
  const bot = new THREE.Mesh(botGeo, topMat);
  bot.position.y = -0.63;
  group.add(bot);

  // 腰封（品牌色）
  const bandGeo = new THREE.CylinderGeometry(0.562, 0.562, 0.4, 32);
  const bandMat = new THREE.MeshStandardMaterial({
    color: accentColor, roughness: 0.5, metalness: 0.05
  });
  const band = new THREE.Mesh(bandGeo, bandMat);
  band.position.y = -0.1;
  group.add(band);

  // 顶部发光圆环（阶段色）
  const stageColor = new THREE.Color(STAGE_COLORS[food.stageKey] || '#d4a574');
  const glowRingGeo = new THREE.TorusGeometry(0.5, 0.04, 8, 32);
  const glowRingMat = new THREE.MeshStandardMaterial({
    color: stageColor, emissive: stageColor, emissiveIntensity: 0.6,
    roughness: 0.3, metalness: 0.2
  });
  const glowRing = new THREE.Mesh(glowRingGeo, glowRingMat);
  glowRing.position.y = 0.7;
  group.add(glowRing);

  // 地面阴影
  const shadowGeo = new THREE.PlaneGeometry(2, 2);
  const shadowMat = new THREE.ShadowMaterial({ opacity: 0.15 });
  const shadow = new THREE.Mesh(shadowGeo, shadowMat);
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -1.3;
  shadow.receiveShadow = true;
  scene.add(shadow);

  // 初始位置
  group.position.y = -0.1;

  // 动画
  let time = Math.random() * Math.PI * 2;
  function animate() {
    canAnimFrames[canvas.id] = requestAnimationFrame(animate);
    time += 0.012;
    group.position.y = -0.1 + Math.sin(time) * 0.08;
    group.rotation.y += 0.005;
    renderer.render(scene, camera);
  }
  animate();

  canRenderers[canvas.id] = renderer;
  canScenes[canvas.id] = scene;
  canCameras[canvas.id] = camera;

  // resize
  const ro = new ResizeObserver(() => {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (w > 0 && h > 0) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
  });
  ro.observe(canvas);
}

// ══════════════════════════════════════
// 屏幕切换
// ══════════════════════════════════════
function switchTab(tab, foodId) {
  document.getElementById('home-screen').classList.toggle('hidden', tab !== 'home');
  document.getElementById('browse-screen').classList.toggle('hidden', tab !== 'browse');
  document.getElementById('detail-screen').classList.toggle('hidden', tab !== 'detail');

  document.querySelectorAll('.toolbar-btn').forEach(b => b.classList.remove('active'));
  const activeMap = { home: 0, browse: 1, detail: 2, compare: 3 };
  if (activeMap[tab] !== undefined) {
    const btns = document.querySelectorAll('.toolbar-btn');
    if (btns[activeMap[tab]]) btns[activeMap[tab]].classList.add('active');
  }

  if (tab === 'browse') {
    document.getElementById('scrollHint').classList.remove('hidden');
    document.getElementById('followHint').classList.remove('hidden');
    renderBrowse();
  } else {
    document.getElementById('scrollHint').classList.add('hidden');
    document.getElementById('followHint').classList.add('hidden');
  }

  if (tab === 'detail' && foodId) {
    showDetail(foodId);
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ══════════════════════════════════════
// 首页渲染
// ══════════════════════════════════════
function renderHome() {
  const grid = document.getElementById('homeProdGrid');
  const featured = FOODS.slice(0, 8);
  grid.innerHTML = featured.map(f => `
    <div class="home-prod-card" onclick="switchTab('detail',${f.id})">
      <div class="home-prod-mini-canvas" id="hmc-${f.id}">
        <canvas id="hmc-can-${f.id}"></canvas>
      </div>
      <div class="home-prod-name">${f.name}</div>
      <div class="home-prod-price">¥${f.price}</div>
      <button class="home-prod-add" onclick="event.stopPropagation();addToCart(${f.id})">+</button>
    </div>
  `).join('');

  // 延迟渲染 3D（等 DOM 就绪）
  requestAnimationFrame(() => {
    featured.forEach(f => {
      const canvas = document.getElementById(`hmc-can-${f.id}`);
      if (canvas && !canRenderers[canvas.id]) {
        createCan3D(canvas, f);
      }
    });
    // Hero 罐头
    const heroCan = document.getElementById('hero-can');
    if (heroCan && !canRenderers[heroCan.id]) {
      createCan3D(heroCan, FOODS[0]);
    }
  });
}

// ══════════════════════════════════════
// 商品列表渲染
// ══════════════════════════════════════
function renderBrowse() {
  const grid = document.getElementById('prodGrid');
  const filtered = currentFilter === 'all'
    ? FOODS
    : FOODS.filter(f => f.stageKey === currentFilter);

  document.getElementById('browseCount').textContent =
    `Showing 1-${Math.min(12, filtered.length)} of ${filtered.length} results`;

  grid.innerHTML = filtered.map((f, i) => `
    <div class="prod-card" onclick="switchTab('detail',${f.id})">
      <div class="prod-card-accent" style="background:${STAGE_COLORS[f.stageKey]}"></div>
      <div class="prod-canvas-wrap">
        <canvas id="pc-can-${f.id}"></canvas>
      </div>
      <div class="prod-card-body">
        <div class="prod-card-brand">${f.brand.split(' ')[0]}</div>
        <div class="prod-card-name">${f.name}</div>
        <div class="prod-card-bottom">
          <span class="prod-card-price">¥${f.price}</span>
          <button class="prod-card-add" onclick="event.stopPropagation();addToCart(${f.id})">+</button>
        </div>
      </div>
    </div>
  `).join('');

  requestAnimationFrame(() => {
    filtered.forEach(f => {
      const canvas = document.getElementById(`pc-can-${f.id}`);
      if (canvas && !canRenderers[canvas.id]) {
        createCan3D(canvas, f);
      }
    });
  });
}

// ══════════════════════════════════════
// 详情页渲染
// ══════════════════════════════════════
function showDetail(foodId) {
  currentFoodId = foodId;
  const f = FOODS.find(x => x.id === foodId);
  if (!f) return;

  document.getElementById('detailNavTitle').textContent = f.brand.split(' ')[0];
  document.getElementById('dcBrand').textContent = f.brand.toUpperCase();
  document.getElementById('dcName').textContent = f.name;
  document.getElementById('dcOrigin').textContent = `🌍 ${f.origin} · ${f.stage}`;
  document.getElementById('dcPrice').textContent = `¥${f.price}`;
  document.getElementById('dcReviews').textContent = `(${Math.floor(Math.random()*200+50)}条评价)`;

  // 颜色选择（用各罐 accent 色）
  const colorDots = FOODS.slice(0, 6).map((cf, i) =>
    `<div class="dc-color-dot ${cf.id === foodId ? 'active' : ''}"
         style="background:${cf.accent}"
         onclick="switchTab('detail',${cf.id})"></div>`
  ).join('');
  document.getElementById('dcColorPicker').innerHTML = colorDots;

  // 规格
  document.getElementById('detailSpecs').innerHTML = `
    <div class="specs-title">📋 营养规格</div>
    <div class="spec-row"><span class="spec-label">粗蛋白质</span><span class="spec-value" style="color:${f.accent}">${f.protein}</span></div>
    <div class="spec-row"><span class="spec-label">粗脂肪</span><span class="spec-value" style="color:${f.accent}">${f.fat}</span></div>
    <div class="spec-row"><span class="spec-label">适用阶段</span><span class="spec-value">${f.stage}</span></div>
    <div class="spec-row"><span class="spec-label">产地</span><span class="spec-value">${f.origin}</span></div>
    <div class="spec-row"><span class="spec-label">适合</span><span class="spec-value" style="font-size:12px">${f.fit}</span></div>
  `;

  // 优点/注意
  document.getElementById('dpcPros').innerHTML = f.pros.map(p => `<li>${p}</li>`).join('');
  document.getElementById('dpcCons').innerHTML = f.cons.map(c => `<li>${c}</li>`).join('');

  // 预览卡片（除了当前商品的随机3款）
  const others = FOODS.filter(x => x.id !== foodId).sort(() => Math.random() - 0.5).slice(0, 3);
  document.getElementById('detailPreviews').innerHTML = others.map(of => `
    <div class="preview-card" onclick="switchTab('detail',${of.id})">
      <div class="preview-canvas"><canvas id="pre-can-${of.id}"></canvas></div>
      <div class="preview-name">${of.name}</div>
      <div class="preview-price">¥${of.price}</div>
      <button class="preview-add" onclick="event.stopPropagation();addToCart(${of.id})">+ 加购</button>
    </div>
  `).join('');

  // 渲染 3D
  requestAnimationFrame(() => {
    const detailCan = document.getElementById('detail-can');
    if (detailCan) {
      if (canRenderers[detailCan.id]) {
        canRenderers[detailCan.id].dispose();
        delete canRenderers[detailCan.id];
      }
      createCan3D(detailCan, f);
    }
    others.forEach(of => {
      const c = document.getElementById(`pre-can-${of.id}`);
      if (c && !canRenderers[c.id]) createCan3D(c, of);
    });
  });

  qty = 1;
  document.getElementById('qtyNum').textContent = qty;
}

// ══════════════════════════════════════
// 数量
// ══════════════════════════════════════
function changeQty(delta) {
  qty = Math.max(1, Math.min(99, qty + delta));
  document.getElementById('qtyNum').textContent = qty;
}

// ══════════════════════════════════════
// 购物车
// ══════════════════════════════════════
function addToCart(foodId) {
  const f = FOODS.find(x => x.id === foodId);
  if (!f) return;
  const existing = cart.find(x => x.id === foodId);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ id: foodId, qty: 1, name: f.name, price: f.price });
  }
  updateCartBadge();
  // 简单 toast
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1e1b4b;color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:999;transition:opacity .3s';
  toast.textContent = `✅ 已加入购物车：${f.name}`;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 1500);
}

function updateCartBadge() {
  const badge = document.getElementById('cartBadge');
  const total = cart.reduce((s, i) => s + i.qty, 0);
  badge.style.display = total > 0 ? 'flex' : 'none';
  badge.textContent = total > 99 ? '99+' : total;
}

// ══════════════════════════════════════
// 筛选
// ══════════════════════════════════════
document.getElementById('filterTabs').addEventListener('click', e => {
  if (e.target.classList.contains('filter-tab')) {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    renderBrowse();
  }
});

// ══════════════════════════════════════
// 规格按钮
// ══════════════════════════════════════
document.getElementById('dcSizeBtns').addEventListener('click', e => {
  if (e.target.classList.contains('dc-size-btn')) {
    document.querySelectorAll('.dc-size-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
  }
});

// ══════════════════════════════════════
// 加入购物车按钮
// ══════════════════════════════════════
document.getElementById('dcAddCartBtn').addEventListener('click', () => {
  addToCart(currentFoodId);
});
document.getElementById('detailBuyBtn').addEventListener('click', () => {
  addToCart(currentFoodId);
  switchTab('browse');
});

// ══════════════════════════════════════
// Three.js 就绪检测 + 启动
// ══════════════════════════════════════
function checkThreeReady() {
  if (typeof THREE !== 'undefined') {
    threeReady = true;
    document.getElementById('loadingOverlay').style.display = 'none';
    renderHome();
  } else {
    setTimeout(checkThreeReady, 200);
  }
}

// 监听窗口 resize 重新渲染所有 canvas
window.addEventListener('resize', () => {
  Object.keys(canRenderers).forEach(id => {
    const canvas = document.getElementById(id);
    if (canvas) {
      const r = canRenderers[id];
      const c = canCameras[id];
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (w > 0 && h > 0) {
        r.setSize(w, h, false);
        c.aspect = w / h;
        c.updateProjectionMatrix();
      }
    }
  });
});

checkThreeReady();
</script>
