<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>布偶猫猫粮3D展览馆</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ══ 色彩体系 ══ */
  --orange:#FF6B35;          /* 活力橙主色 */
  --orange-dark:#E8541E;
  --orange-light:#FF8C5E;
  --orange-soft:#FFE8DC;
  --bg:#E8ECF2;              /* 中性灰背景（新拟态基底） */
  --surface:#EEF1F6;         /* 卡片表面 */
  --text:#2D3436;            /* 深炭黑文字 */
  --text-light:#8A929B;      /* 次要文字 */
  --shadow-dark:rgba(163,177,198,.55);   /* 新拟态暗影 */
  --shadow-light:rgba(255,255,255,.9);   /* 新拟态亮影 */
  /* 辅助色：粉彩 */
  --pastel-pink:#FFE0E6;
  --pastel-blue:#DCE9FF;
  --pastel-purple:#ECE3FF;
  --pastel-green:#DCF2E6;
  --pastel-peach:#FFE9D6;
  --radius:24px;
  --neu:6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
  --neu-sm:4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
  --neu-inset:inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
}
html,body{font-family:'SF Pro Display','PingFang SC','Montserrat',-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}

.hidden{display:none!important}

/* 通用新拟态卡片 */
.neu{background:var(--surface);box-shadow:var(--neu)}
.neu-inset{box-shadow:var(--neu-inset)}

/* 光影流动动画 */
@keyframes lightFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.flow{
  background:linear-gradient(120deg,var(--orange),var(--orange-light),var(--orange-dark),var(--orange));
  background-size:300% 300%;
  animation:lightFlow 5s ease infinite;
}

/* ══════════════════════════════════════
   SCREEN 1: HOME
══════════════════════════════════════ */
#home-screen{min-height:100vh;display:flex;flex-direction:column;position:relative}

/* 顶部导航 */
.home-nav{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px;padding-top:max(16px,env(safe-area-inset-top));
  background:rgba(232,236,242,.8);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.nav-logo{
  display:flex;align-items:center;gap:8px;
  font-weight:800;font-size:17px;letter-spacing:-.5px;color:var(--text);
}
.nav-logo .logo-mark{
  width:36px;height:36px;border-radius:12px;
  background:linear-gradient(135deg,var(--orange),var(--orange-light));
  box-shadow:var(--neu-sm);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.nav-actions{display:flex;gap:10px}
.icon-btn{
  width:42px;height:42px;border-radius:14px;border:none;cursor:pointer;
  background:var(--surface);box-shadow:var(--neu-sm);color:var(--orange);font-size:17px;
  display:flex;align-items:center;justify-content:center;transition:.18s;
}
.icon-btn:active{box-shadow:var(--neu-inset);transform:scale(.95)}

/* Hero 新拟态面板 */
.home-hero{
  margin:18px 22px 8px;
  padding:28px 24px;border-radius:var(--radius);
  background:var(--surface);box-shadow:var(--neu);
  text-align:center;position:relative;overflow:hidden;
}
.home-hero::before{
  content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,var(--orange-soft),transparent 70%);
}
.home-hero h1{
  font-size:clamp(24px,5.5vw,38px);font-weight:800;line-height:1.2;color:var(--text);
  position:relative;
}
.home-hero h1 .hl{
  background:linear-gradient(120deg,var(--orange),var(--orange-dark));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.home-hero p{color:var(--text-light);font-size:14px;margin-top:10px;position:relative}
.home-hero .hero-tag{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;
  padding:7px 16px;border-radius:30px;font-size:12px;font-weight:700;color:var(--orange-dark);
  background:var(--surface);box-shadow:var(--neu-inset);position:relative;
}

/* 首页 3D 预览罐 */
.home-can-hero{display:flex;justify-content:center;padding:8px 0 4px}
#hero-canvas-wrap{
  width:170px;height:170px;border-radius:50%;
  background:var(--surface);box-shadow:var(--neu);
  display:flex;align-items:center;justify-content:center;
}
#hero-canvas-wrap canvas{width:88%!important;height:88%!important}

/* 首页缩略商品列表 */
.home-products{padding:14px 22px 32px}
.home-products-label{
  font-size:12px;font-weight:700;color:var(--text-light);text-transform:uppercase;
  letter-spacing:1.5px;margin-bottom:14px;padding-left:4px;
}
.home-prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.home-prod-card{
  background:var(--surface);border-radius:18px;padding:12px;
  box-shadow:var(--neu-sm);cursor:pointer;
  transition:transform .22s,box-shadow .22s;position:relative;overflow:hidden;
}
.home-prod-card:active{box-shadow:var(--neu-inset);transform:scale(.97)}
.home-prod-mini-canvas{
  width:100%;aspect-ratio:1;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
}
.home-prod-mini-canvas canvas{width:90%!important;height:90%!important;border-radius:14px}
.home-prod-name{
  font-size:11px;font-weight:700;margin-top:8px;line-height:1.3;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.home-prod-price{font-size:12px;color:var(--orange-dark);font-weight:800;margin-top:4px}
.home-prod-add{
  position:absolute;top:10px;right:10px;
  width:26px;height:26px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--orange),var(--orange-light));
  color:#fff;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--neu-sm);transition:.18s;
}
.home-prod-add:active{transform:scale(.85);box-shadow:var(--neu-inset)}

/* 底部胶囊工具栏 */
.bottom-toolbar{
  position:fixed;bottom:max(16px,env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);z-index:100;
  background:var(--surface);box-shadow:var(--neu);
  border-radius:32px;padding:8px;display:flex;align-items:center;gap:4px;
}
.toolbar-btn{
  border:none;background:transparent;color:var(--text-light);
  font-size:12px;font-weight:700;padding:9px 16px;border-radius:24px;cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:.2s;white-space:nowrap;
}
.toolbar-btn.active{
  background:linear-gradient(135deg,var(--orange),var(--orange-light));
  color:#fff;box-shadow:var(--neu-sm);
}
.toolbar-btn:active{transform:scale(.95)}
.toolbar-btn .tb-icon{font-size:16px}

/* 右下浮动按钮 */
.floating-drawer-btn{
  position:fixed;bottom:max(82px,calc(16px + env(safe-area-inset-bottom) + 64px));
  right:20px;z-index:99;
  width:52px;height:52px;border-radius:18px;border:none;
  background:linear-gradient(135deg,var(--orange),var(--orange-light));
  color:#fff;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--neu);transition:.2s;
}
.floating-drawer-btn:active{transform:scale(.92);box-shadow:var(--neu-inset)}

/* ══════════════════════════════════════
   SCREEN 2: BROWSE
══════════════════════════════════════ */
#browse-screen{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);padding-bottom:80px}

.browse-nav{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;padding-top:max(14px,env(safe-area-inset-top));
  background:rgba(232,236,242,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.back-btn{
  width:40px;height:40px;border-radius:14px;border:none;cursor:pointer;
  background:var(--surface);box-shadow:var(--neu-sm);color:var(--text);font-size:18px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.18s;
}
.back-btn:active{box-shadow:var(--neu-inset);transform:scale(.95)}
.browse-title{flex:1;font-weight:800;font-size:17px;text-align:center;color:var(--text)}
.browse-cart{
  width:40px;height:40px;border-radius:14px;border:none;cursor:pointer;
  background:var(--surface);box-shadow:var(--neu-sm);
  color:var(--orange);font-size:17px;position:relative;
  display:flex;align-items:center;justify-content:center;transition:.18s;
}
.browse-cart:active{box-shadow:var(--neu-inset);transform:scale(.95)}
.cart-badge{
  position:absolute;top:-3px;right:-3px;
  background:var(--orange);color:#fff;font-size:9px;font-weight:800;
  min-width:17px;height:17px;border-radius:9px;padding:0 4px;
  display:flex;align-items:center;justify-content:center;
}

/* 橙黄 Banner（光影流动） */
.browse-banner{
  margin:16px 20px;border-radius:var(--radius);padding:24px 22px;
  color:#fff;position:relative;overflow:hidden;box-shadow:var(--neu);
}
.browse-banner::after{
  content:'';position:absolute;right:-30px;top:-30px;
  width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18);
}
.browse-banner::before{
  content:'';position:absolute;left:-20px;bottom:-40px;
  width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);
}
.browse-banner-eyebrow{font-size:11px;opacity:.9;letter-spacing:1px;text-transform:uppercase;font-weight:600}
.browse-banner h2{font-size:23px;font-weight:800;line-height:1.25;margin:6px 0 8px;position:relative}
.browse-banner p{font-size:13px;opacity:.92;position:relative}
.browse-banner-tag{
  display:inline-flex;align-items:center;gap:5px;margin-top:12px;
  background:rgba(255,255,255,.22);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;position:relative;
}

/* 筛选标签（新拟态胶囊） */
.filter-tabs{display:flex;gap:10px;overflow-x:auto;padding:16px 20px 4px;scrollbar-width:none}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{
  flex-shrink:0;border:none;border-radius:20px;padding:9px 18px;
  font-size:13px;font-weight:700;cursor:pointer;color:var(--text-light);
  background:var(--surface);box-shadow:var(--neu-sm);transition:.18s;white-space:nowrap;
}
.filter-tab.active{
  color:#fff;
  background:linear-gradient(135deg,var(--orange),var(--orange-light));
  box-shadow:var(--neu-sm);
}
.filter-tab:active{box-shadow:var(--neu-inset);transform:scale(.95)}

/* 计数行 */
.browse-count-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 22px 12px;font-size:12px;color:var(--text-light);font-weight:600}
.sort-btn{display:flex;align-items:center;gap:4px;border:none;background:transparent;color:var(--text);font-size:12px;font-weight:700;cursor:pointer}

/* 商品卡片网格（新拟态 + 粉彩背景） */
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 20px 20px}
.prod-card{
  background:var(--surface);border-radius:20px;overflow:hidden;
  box-shadow:var(--neu-sm);cursor:pointer;
  transition:transform .22s,box-shadow .22s;position:relative;
  display:flex;flex-direction:column;
}
.prod-card:active{transform:scale(.97);box-shadow:var(--neu-inset)}
.prod-canvas-wrap{
  width:100%;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.prod-canvas-wrap canvas{width:82%!important;height:82%!important;filter:drop-shadow(0 8px 16px rgba(0,0,0,.12))}
.prod-card:hover .prod-canvas-wrap canvas{animation:canFloat .9s ease-in-out}
@keyframes canFloat{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7px) rotate(-3deg)}75%{transform:translateY(-3px) rotate(3deg)}}
.prod-card-body{padding:11px 12px 13px;background:var(--surface)}
.prod-card-brand{font-size:10px;color:var(--text-light);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.prod-card-name{font-size:12px;font-weight:800;line-height:1.3;margin-top:3px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.prod-card-price{font-size:14px;font-weight:800;color:var(--orange-dark)}
.prod-card-add{
  width:28px;height:28px;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--orange),var(--orange-light));
  color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--neu-sm);transition:.18s;
}
.prod-card-add:active{transform:scale(.85);box-shadow:var(--neu-inset)}

/* 侧边竖排文字 */
.scroll-hint{position:fixed;left:6px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:10px;color:var(--text-light);letter-spacing:1px;opacity:.5;z-index:5}
.follow-hint{position:fixed;right:6px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:10px;color:var(--text-light);letter-spacing:1px;opacity:.5;z-index:5}

/* ══════════════════════════════════════
   SCREEN 3: DETAIL
══════════════════════════════════════ */
#detail-screen{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);padding-bottom:100px}

.detail-nav{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;padding-top:max(14px,env(safe-area-inset-top));
  background:rgba(232,236,242,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.detail-nav-title{font-weight:800;font-size:16px;color:var(--text)}
.detail-nav-actions{display:flex;gap:10px}

/* 圆点装饰 */
.detail-dots{position:absolute;top:70px;right:20px;display:grid;grid-template-columns:repeat(4,6px);gap:8px;opacity:.25}
.dot{width:6px;height:6px;border-radius:50%;background:var(--orange)}

/* 紫色→橙色 大卡（新拟态风格） */
.detail-main-card{
  margin:16px 20px;border-radius:var(--radius);overflow:hidden;
  background:linear-gradient(145deg,var(--orange),var(--orange-dark));
  color:#fff;position:relative;padding:22px;box-shadow:var(--neu);
}
.detail-main-card::before{content:'';position:absolute;top:-50px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1)}
.dc-360-btn{
  position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:14px;border:none;cursor:pointer;
  background:rgba(255,255,255,.2);color:#fff;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:.18s;
}
.dc-360-btn:active{transform:scale(.9);background:rgba(255,255,255,.3)}
.detail-canvas-wrap{width:180px;height:180px;margin:0 auto 14px;background:rgba(255,255,255,.12);border-radius:50%;display:flex;align-items:center;justify-content:center}
.detail-canvas-wrap canvas{width:92%!important;height:92%!important}
.dc-brand{font-size:12px;opacity:.85;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.dc-name{font-size:21px;font-weight:800;line-height:1.2;margin:4px 0 6px}
.dc-origin{font-size:13px;opacity:.8}
.dc-price-row{display:flex;align-items:center;gap:12px;margin:14px 0}
.dc-price{font-size:28px;font-weight:800}
.dc-unit{font-size:13px;opacity:.8}
.dc-stars{display:flex;gap:2px;font-size:14px;color:#FFD54F}
.dc-reviews{font-size:11px;opacity:.75;margin-left:6px}
.dc-color-picker{display:flex;gap:8px;margin:12px 0}
.dc-color-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.18s;box-shadow:var(--neu-sm)}
.dc-color-dot.active{border-color:#fff;transform:scale(1.25)}
.dc-size-btns{display:flex;gap:8px;flex-wrap:wrap}
.dc-size-btn{
  border:none;border-radius:14px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.18);color:#fff;transition:.18s;
}
.dc-size-btn.active{background:#fff;color:var(--orange-dark)}
.dc-size-btn:active{transform:scale(.95)}
.dc-qty{display:flex;align-items:center;gap:14px;margin:14px 0}
.qty-btn{
  width:36px;height:36px;border-radius:12px;border:none;cursor:pointer;
  background:rgba(255,255,255,.2);color:#fff;font-size:18px;font-weight:700;
  display:flex;align-items:center;justify-content:center;transition:.18s;
}
.qty-btn:active{transform:scale(.9);background:rgba(255,255,255,.35)}
.qty-num{font-size:19px;font-weight:800;min-width:26px;text-align:center}
.dc-add-cart-btn{
  width:100%;border:none;border-radius:16px;padding:15px;
  background:#fff;color:var(--text);font-size:15px;font-weight:800;cursor:pointer;
  margin-top:10px;box-shadow:var(--neu-sm);transition:.18s;
}
.dc-add-cart-btn:active{transform:scale(.98);box-shadow:var(--neu-inset)}

/* 规格列表（新拟态 inset） */
.detail-specs{margin:16px 20px;background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--neu)}
.specs-title{font-size:14px;font-weight:800;margin-bottom:12px;color:var(--text);padding-left:4px}
.spec-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(163,177,198,.2)}
.spec-row:last-child{border-bottom:none}
.spec-label{font-size:13px;color:var(--text-light);font-weight:600}
.spec-value{font-size:13px;font-weight:800;color:var(--text);text-align:right;max-width:60%}

/* 优点/注意 */
.detail-pros-cons{margin:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dpc-card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--neu-sm)}
.dpc-title{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:4px}
.dpc-title.pros{color:#16A34A}
.dpc-title.cons{color:#DC2626}
.dpc-list{list-style:none}
.dpc-list li{font-size:11px;color:var(--text-light);padding:3px 0;line-height:1.4}

/* 预览卡片 */
.detail-previews{margin:16px 20px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.preview-card{background:var(--surface);border-radius:14px;padding:10px;box-shadow:var(--neu-sm);cursor:pointer;transition:.18s}
.preview-card:active{transform:scale(.96);box-shadow:var(--neu-inset)}
.preview-canvas{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.preview-canvas canvas{width:90%!important;height:90%!important;border-radius:12px}
.preview-name{font-size:11px;font-weight:700;margin-top:6px;line-height:1.3;text-align:center;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preview-price{font-size:12px;font-weight:800;color:var(--orange-dark);text-align:center;margin-top:2px}
.preview-add{display:block;width:100%;margin-top:6px;border:none;border-radius:10px;padding:6px;background:linear-gradient(135deg,var(--orange),var(--orange-light));color:#fff;font-size:11px;font-weight:700;cursor:pointer;transition:.18s}
.preview-add:active{transform:scale(.95)}

/* 底部导航栏 */
.detail-bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  padding:12px 20px max(12px,env(safe-area-inset-bottom));
  background:rgba(232,236,242,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(163,177,198,.2);
  display:flex;align-items:center;gap:12px;z-index:50;
}
.detail-back-btn{border:none;border-radius:14px;padding:13px 20px;background:var(--surface);box-shadow:var(--neu-sm);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;transition:.18s}
.detail-back-btn:active{box-shadow:var(--neu-inset);transform:scale(.97)}
.detail-buy-btn{flex:1;border:none;border-radius:14px;padding:13px;background:linear-gradient(135deg,var(--orange),var(--orange-light));color:#fff;font-size:14px;font-weight:800;cursor:pointer;box-shadow:var(--neu-sm);transition:.18s}
.detail-buy-btn:active{transform:scale(.98);box-shadow:var(--neu-inset)}

/* 加载状态（新拟态） */
.loading-overlay{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
.loading-cat{width:90px;height:90px;border-radius:50%;background:var(--surface);box-shadow:var(--neu);display:flex;align-items:center;justify-content:center;font-size:42px;animation:catBounce 1s ease-in-out infinite}
@keyframes catBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.loading-text{font-size:14px;color:var(--text-light);margin-top:20px;font-weight:700}
.loading-bar{width:160px;height:8px;border-radius:4px;margin-top:14px;background:var(--surface);box-shadow:var(--neu-inset);overflow:hidden}
.loading-bar-fill{height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--orange),var(--orange-light));animation:loadingBar 1.4s ease-in-out infinite}
@keyframes loadingBar{0%{margin-left:-40%}100%{margin-left:100%}}

/* Toast */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--surface);box-shadow:var(--neu);color:var(--text);padding:12px 22px;border-radius:30px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 响应式 */
@media(max-width:480px){
  .home-prod-grid{grid-template-columns:repeat(2,1fr)}
  .prod-grid{grid-template-columns:repeat(2,1fr)}
  .detail-previews{grid-template-columns:repeat(2,1fr)}
  .browse-banner h2{font-size:19px}
}
@media(max-width:360px){
  .home-prod-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .prod-grid{grid-template-columns:repeat(2,1fr);gap:10px}
}

  const top=new THREE.Mesh(new THREE.CylinderGeometry(0.56,0.56,0.08,32),topMat); top.position.y=0.64; top.castShadow=true; group.add(top);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.12,0.025,8,16,Math.PI*1.5),new THREE.MeshStandardMaterial({color:metalColor,roughness:0.2,metalness:0.9}));
  ring.position.set(0,0.72,0.1); ring.rotation.x=-0.3; group.add(ring);
  const bot=new THREE.Mesh(new THREE.CylinderGeometry(0.56,0.52,0.06,32),topMat); bot.position.y=-0.63; group.add(bot);
  const band=new THREE.Mesh(new THREE.CylinderGeometry(0.562,0.562,0.4,32),new THREE.MeshStandardMaterial({color:accentColor,roughness:0.5,metalness:0.05}));
  band.position.y=-0.1; group.add(band);
  const stageColor=new THREE.Color(STAGE_COLORS[food.stageKey]||'#d4a574');
  const glow=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.04,8,32),new THREE.MeshStandardMaterial({color:stageColor,emissive:stageColor,emissiveIntensity:0.6,roughness:0.3,metalness:0.2}));
  glow.position.y=0.7; group.add(glow);
  const shadow=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShadowMaterial({opacity:0.15}));
  shadow.rotation.x=-Math.PI/2; shadow.position.y=-1.3; shadow.receiveShadow=true; scene.add(shadow);
  group.position.y=-0.1;
  let time=Math.random()*Math.PI*2;
  function animate(){
    canAnimFrames[canvas.id]=requestAnimationFrame(animate);
    time+=0.012;
    group.position.y=-0.1+Math.sin(time)*0.07;
    group.rotation.y+=0.005;
    renderer.render(scene,camera);
  }
  animate();
  canRenderers[canvas.id]=renderer; canScenes[canvas.id]=scene; canCameras[canvas.id]=camera;
  const ro=new ResizeObserver(()=>{const w=canvas.clientWidth,h=canvas.clientHeight;if(w>0&&h>0){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}});
  ro.observe(canvas);
}

function switchTab(tab,foodId){
  document.getElementById('home-screen').classList.toggle('hidden',tab!=='home');
  document.getElementById('browse-screen').classList.toggle('hidden',tab!=='browse');
  document.getElementById('detail-screen').classList.toggle('hidden',tab!=='detail');
  document.querySelectorAll('.toolbar-btn').forEach(b=>b.classList.remove('active'));
  const map={home:0,browse:1,detail:2,compare:3};
  if(map[tab]!==undefined){const b=document.querySelectorAll('.toolbar-btn');if(b[map[tab]])b[map[tab]].classList.add('active');}
  if(tab==='browse'){document.getElementById('scrollHint').classList.remove('hidden');document.getElementById('followHint').classList.remove('hidden');renderBrowse();}
  else{document.getElementById('scrollHint').classList.add('hidden');document.getElementById('followHint').classList.add('hidden');}
  if(tab==='detail'&&foodId)showDetail(foodId);
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderHome(){
  const grid=document.getElementById('homeProdGrid');
  const featured=FOODS.slice(0,8);
  grid.innerHTML=featured.map((f,i)=>`
    <div class="home-prod-card" onclick="switchTab('detail',${f.id})">
      <div class="home-prod-mini-canvas" style="background:${PASTELS[i%PASTELS.length]}"><canvas id="hmc-can-${f.id}"></canvas></div>
      <div class="home-prod-name">${f.name}</div>
      <div class="home-prod-price">¥${f.price}</div>
      <button class="home-prod-add" onclick="event.stopPropagation();addToCart(${f.id})">+</button>
    </div>`).join('');
  requestAnimationFrame(()=>{
    featured.forEach(f=>{const c=document.getElementById(`hmc-can-${f.id}`);if(c&&!canRenderers[c.id])createCan3D(c,f);});
    const h=document.getElementById('hero-can');if(h&&!canRenderers[h.id])createCan3D(h,FOODS[0]);
  });
}

function renderBrowse(){
  const grid=document.getElementById('prodGrid');
  const filtered=currentFilter==='all'?FOODS:FOODS.filter(f=>f.stageKey===currentFilter);
  document.getElementById('browseCount').textContent=`Showing 1-${Math.min(12,filtered.length)} of ${filtered.length} results`;
  grid.innerHTML=filtered.map((f,i)=>`
    <div class="prod-card" onclick="switchTab('detail',${f.id})">
      <div class="prod-canvas-wrap" style="background:${PASTELS[i%PASTELS.length]}"><canvas id="pc-can-${f.id}"></canvas></div>
      <div class="prod-card-body">
        <div class="prod-card-brand">${f.brand.split(' ')[0]}</div>
        <div class="prod-card-name">${f.name}</div>
        <div class="prod-card-bottom"><span class="prod-card-price">¥${f.price}</span><button class="prod-card-add" onclick="event.stopPropagation();addToCart(${f.id})">+</button></div>
      </div>
    </div>`).join('');
  requestAnimationFrame(()=>{filtered.forEach(f=>{const c=document.getElementById(`pc-can-${f.id}`);if(c&&!canRenderers[c.id])createCan3D(c,f);});});
}

function showDetail(foodId){
  currentFoodId=foodId;
  const f=FOODS.find(x=>x.id===foodId); if(!f)return;
  document.getElementById('detailNavTitle').textContent=f.brand.split(' ')[0];
  document.getElementById('dcBrand').textContent=f.brand.toUpperCase();
  document.getElementById('dcName').textContent=f.name;
  document.getElementById('dcOrigin').textContent=`🌍 ${f.origin} · ${f.stage}`;
  document.getElementById('dcPrice').textContent=`¥${f.price}`;
  document.getElementById('dcReviews').textContent=`(${Math.floor(Math.random()*200+50)}条评价)`;
  document.getElementById('dcColorPicker').innerHTML=FOODS.slice(0,6).map(cf=>`<div class="dc-color-dot ${cf.id===foodId?'active':''}" style="background:${cf.accent}" onclick="switchTab('detail',${cf.id})"></div>`).join('');
  document.getElementById('detailSpecs').innerHTML=`
    <div class="specs-title">📋 营养规格</div>
    <div class="spec-row"><span class="spec-label">粗蛋白质</span><span class="spec-value" style="color:${f.accent}">${f.protein}</span></div>
    <div class="spec-row"><span class="spec-label">粗脂肪</span><span class="spec-value" style="color:${f.accent}">${f.fat}</span></div>
    <div class="spec-row"><span class="spec-label">适用阶段</span><span class="spec-value">${f.stage}</span></div>
    <div class="spec-row"><span class="spec-label">产地</span><span class="spec-value">${f.origin}</span></div>
    <div class="spec-row"><span class="spec-label">适合</span><span class="spec-value" style="font-size:12px">${f.fit}</span></div>`;
  document.getElementById('dpcPros').innerHTML=f.pros.map(p=>`<li>${p}</li>`).join('');
  document.getElementById('dpcCons').innerHTML=f.cons.map(c=>`<li>${c}</li>`).join('');
  const others=FOODS.filter(x=>x.id!==foodId).sort(()=>Math.random()-0.5).slice(0,3);
  document.getElementById('detailPreviews').innerHTML=others.map((of,i)=>`
    <div class="preview-card" onclick="switchTab('detail',${of.id})">
      <div class="preview-canvas" style="background:${PASTELS[i%PASTELS.length]}"><canvas id="pre-can-${of.id}"></canvas></div>
      <div class="preview-name">${of.name}</div>
      <div class="preview-price">¥${of.price}</div>
      <button class="preview-add" onclick="event.stopPropagation();addToCart(${of.id})">+ 加购</button>
    </div>`).join('');
  requestAnimationFrame(()=>{
    const d=document.getElementById('detail-can');
    if(d){if(canRenderers[d.id]){canRenderers[d.id].dispose();delete canRenderers[d.id];}createCan3D(d,f);}
    others.forEach((of,i)=>{const c=document.getElementById(`pre-can-${of.id}`);if(c&&!canRenderers[c.id])createCan3D(c,of);});
  });
  qty=1; document.getElementById('qtyNum').textContent=qty;
}

function changeQty(d){qty=Math.max(1,Math.min(99,qty+d));document.getElementById('qtyNum').textContent=qty;}

function addToCart(foodId){
  const f=FOODS.find(x=>x.id===foodId); if(!f)return;
  const ex=cart.find(x=>x.id===foodId);
  if(ex)ex.qty+=1; else cart.push({id:foodId,qty:1,name:f.name,price:f.price});
  updateCartBadge();
  const t=document.getElementById('toast')||(()=>{const e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e);return e;})();
  t.textContent=`✅ 已加入购物车：${f.name}`; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1500);
}
function updateCartBadge(){const b=document.getElementById('cartBadge');const t=cart.reduce((s,i)=>s+i.qty,0);b.style.display=t>0?'flex':'none';b.textContent=t>99?'99+':t;}

document.getElementById('filterTabs').addEventListener('click',e=>{
  if(e.target.classList.contains('filter-tab')){
    document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');currentFilter=e.target.dataset.filter;renderBrowse();
  }
});
document.getElementById('dcSizeBtns').addEventListener('click',e=>{
  if(e.target.classList.contains('dc-size-btn')){
    document.querySelectorAll('.dc-size-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');
  }
});
document.getElementById('dcAddCartBtn').addEventListener('click',()=>addToCart(currentFoodId));
document.getElementById('detailBuyBtn').addEventListener('click',()=>{addToCart(currentFoodId);switchTab('browse');});

function checkThreeReady(){
  if(typeof THREE!=='undefined'){document.getElementById('loadingOverlay').style.display='none';renderHome();}
  else setTimeout(checkThreeReady,200);
}
window.addEventListener('resize',()=>{Object.keys(canRenderers).forEach(id=>{const c=document.getElementById(id);if(c){const r=canRenderers[id],cam=canCameras[id];const w=c.clientWidth,h=c.clientHeight;if(w>0&&h>0){r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}}});});
checkThreeReady();
</script>
