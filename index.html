<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>布偶猫猫粮3D展览馆 · Ragdoll Cat Food 3D Museum</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading">
  <div class="cat-loader">🐱</div>
  <p id="loading-text">正在加载 3D 展览馆...</p>
  <p id="error-msg" style="display:none"></p>
</div>

<div id="canvas-container"></div>

<div id="header">
  <div id="title-bar">
    <h1>布偶猫猫粮3D展览馆</h1>
    <p>RAGDOLL · CAT FOOD MUSEUM · 3D</p>
  </div>
  <div id="stage-labels"></div>
  <button id="back-btn">← 返回展馆</button>
  <div id="filters"></div>
  <div id="hint">拖拽环视 · 滚轮缩放 · 点击罐体查看详情</div>
</div>

<div id="detail">
  <div id="detail-inner"></div>
  <button id="detail-close">×</button>
</div>

<!-- Error handler -->
<script>
window.addEventListener('error', function(e) {
  var lt = document.getElementById('loading-text');
  var err = document.getElementById('error-msg');
  if (lt) lt.style.display = 'none';
  if (err) {
    err.style.display = 'block';
    err.innerHTML = '⚠️ 加载失败<br><small style="opacity:.7">' + (e.message || '未知错误') + '</small>';
  }
  console.error('Page error:', e);
});
</script>

<!-- Main module: load Three.js + OrbitControls locally, expose globally, then init -->
<script type="module">
import * as THREE from './vendor/three.module.js';
import { OrbitControls } from './vendor/OrbitControls.module.js';

window.THREE = THREE;
window.OrbitControls = OrbitControls;
window.__libsReady = true;


// Wait for OrbitControls to be ready
function waitForOrbit(callback, attempts) {
  attempts = attempts || 0;
  if (window.THREE && window.OrbitControls) {
    callback();
  } else if (attempts < 100) {
    setTimeout(function() { waitForOrbit(callback, attempts + 1); }, 50);
  } else {
    var err = document.getElementById('error-msg');
    var lt = document.getElementById('loading-text');
    if (lt) lt.style.display = 'none';
    if (err) {
      err.style.display = 'block';
      err.innerHTML = '⚠️ Three.js 或 OrbitControls 加载失败<br><small>请检查网络连接</small>';
    }
  }
}

const SHELF_Y = [7.2, 5.65, 4.1, 2.55, 1.0];
const COL_X = [-4.8, -1.6, 1.6, 4.8];
const SHELF_Z = -6.35, SHELF_W = 12.6, SHELF_D = 1.5, SHELF_T = 0.22;
const CAN_R = 0.62, CAN_H = 1.35;
const ROW_LABELS = [
  {key:'kitten',label:'幼猫期',stageKey:'kitten'},
  {key:'adult',label:'成猫期',stageKey:'adult'},
  {key:'special',label:'功能型',stageKey:'special'},
  {key:'mixed',label:'老年·冻干',stageKey:'mixed'},
  {key:'domestic',label:'国货精选',stageKey:'domestic'}
];

const OrbitControls = window.OrbitControls;

function init() {
  document.getElementById('loading-text').textContent = 'Three.js 已就绪...';

  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
  const CAM_INIT = new THREE.Vector3(0, 4.8, 18);
  const CAM_LOOK = new THREE.Vector3(0, 4.15, SHELF_Z);
  camera.position.copy(CAM_INIT);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x1a0f08, 12, 30);
  scene.background = new THREE.Color(0x1a0f08);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(CAM_LOOK);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 6;
  controls.maxDistance = 25;
  controls.maxPolarAngle = Math.PI * 0.55;
  controls.minPolarAngle = Math.PI * 0.2;
  controls.update();

  // Lights
  scene.add(new THREE.AmbientLight(0x3a2515, 0.4));
  const topLight = new THREE.SpotLight(0xffd9a0, 2.5, 30, Math.PI/4, 0.5);
  topLight.position.set(0, 12, -2);
  topLight.target.position.set(0, 4, SHELF_Z);
  scene.add(topLight, topLight.target);
  for (let i = 0; i < 5; i++) {
    const pl = new THREE.PointLight(0xffd9a0, 0.6, 8);
    pl.position.set(-6.4 + i * 3.2, 5.4, -4.4);
    scene.add(pl);
  }

  // Room
  const wallMat = new THREE.MeshStandardMaterial({color:0x2a1810, roughness:0.9});
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(54, 26), wallMat);
  wall.position.set(0, 8, SHELF_Z - SHELF_D/2 - 0.5);
  scene.add(wall);
  for (let i = -12; i <= 12; i += 0.8) {
    const plank = new THREE.Mesh(
      new THREE.PlaneGeometry(0.04, 26),
      new THREE.MeshBasicMaterial({color:0x1a0c06, transparent:true, opacity:0.4})
    );
    plank.position.set(i, 8, SHELF_Z - SHELF_D/2 - 0.48);
    scene.add(plank);
  }
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(54, 30),
    new THREE.MeshStandardMaterial({color:0x1f1208, roughness:1})
  );
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);
  const carpet = new THREE.Mesh(
    new THREE.PlaneGeometry(16, 10),
    new THREE.MeshStandardMaterial({color:0x4a2a18, roughness:0.8})
  );
  carpet.rotation.x = -Math.PI/2;
  carpet.position.set(0, 0.01, -1);
  scene.add(carpet);

  // Plaque
  const plaqueCanvas = document.createElement('canvas');
  plaqueCanvas.width = 512; plaqueCanvas.height = 128;
  const pctx = plaqueCanvas.getContext('2d');
  pctx.fillStyle = '#1a0f08'; pctx.fillRect(0,0,512,128);
  pctx.fillStyle = '#d4a574'; pctx.font = 'bold 36px serif'; pctx.textAlign = 'center';
  pctx.fillText('🐱 布偶猫猫粮展览馆 🐱', 256, 75);
  pctx.font = '14px serif'; pctx.fillStyle = '#8a6a3a';
  pctx.fillText('RAGDOLL CAT FOOD MUSEUM', 256, 100);
  const plaque = new THREE.Mesh(
    new THREE.PlaneGeometry(6, 1.5),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(plaqueCanvas)})
  );
  plaque.position.set(0, 9.5, SHELF_Z - 0.5);
  scene.add(plaque);

  // Shelves
  const woodMat = new THREE.MeshStandardMaterial({color:0x8b6d4a, roughness:0.7});
  const woodDarkMat = new THREE.MeshStandardMaterial({color:0x6b5035, roughness:0.7});
  SHELF_Y.forEach((y) => {
    const board = new THREE.Mesh(new THREE.BoxGeometry(SHELF_W, SHELF_T, SHELF_D), woodMat);
    board.position.set(0, y - CAN_H/2 - 0.1, SHELF_Z);
    scene.add(board);
  });
  for (let x of [-SHELF_W/2 + 0.2, 0, SHELF_W/2 - 0.2]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.26, 9.1, 0.4), woodDarkMat);
    post.position.set(x, 4.6, SHELF_Z);
    scene.add(post);
  }
  const canopy = new THREE.Mesh(new THREE.BoxGeometry(SHELF_W + 0.6, 0.3, SHELF_D + 0.3), woodDarkMat);
  canopy.position.set(0, SHELF_Y[0] + CAN_H/2 + 0.2, SHELF_Z);
  scene.add(canopy);

  // Cans
  function createLabelTexture(food) {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0,0,0,128);
    grad.addColorStop(0, '#f5ead0'); grad.addColorStop(0.5, '#ede0c8'); grad.addColorStop(1, '#e8d5b8');
    ctx.fillStyle = grad; ctx.fillRect(0,0,256,128);
    const accentHex = '#' + food.accent.toString(16).padStart(6,'0');
    ctx.fillStyle = accentHex; ctx.fillRect(0, 85, 256, 20);
    ctx.fillStyle = '#3d2e25';
    ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(food.brand.split(' ')[0], 128, 30);
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(food.name, 128, 50);
    ctx.fillStyle = accentHex; ctx.font = 'bold 10px sans-serif';
    ctx.fillText(STAGE_META[food.stageKey].name, 128, 70);
    ctx.fillStyle = '#3d2e25'; ctx.font = 'bold 9px sans-serif';
    ctx.fillText('P'+food.protein+' F'+food.fat, 128, 115);
    const tex = new THREE.CanvasTexture(c);
    tex.offset.x = 0.5;
    return tex;
  }

  const cans = [];
  let foodIdx = 0;
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 4; col++) {
      const food = FOODS[foodIdx++];
      if (!food) break;
      const canGroup = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({map:createLabelTexture(food), roughness:0.4});
      const body = new THREE.Mesh(new THREE.CylinderGeometry(CAN_R, CAN_R, CAN_H, 32, 1, true), bodyMat);
      canGroup.add(body);
      const capMat = new THREE.MeshStandardMaterial({color:0xc4b090, roughness:0.3, metalness:0.3});
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(CAN_R*0.95, CAN_R*0.95, 0.1, 32), capMat);
      cap.position.y = CAN_H/2 + 0.05;
      canGroup.add(cap);
      const bottom = new THREE.Mesh(new THREE.CylinderGeometry(CAN_R*0.95, CAN_R*0.95, 0.08, 32), capMat);
      bottom.position.y = -CAN_H/2 - 0.04;
      canGroup.add(bottom);
      canGroup.position.set(COL_X[col], SHELF_Y[row], SHELF_Z);
      canGroup.userData = {food, row, col, originalY: SHELF_Y[row]};
      scene.add(canGroup);
      cans.push(canGroup);
    }
  }

  // Interaction
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let hoveredCan = null, selectedCan = null, focusedMode = false;

  function onPointerMove(e) {
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    if (focusedMode) return;
    raycaster.setFromCamera(mouse, camera);
    const meshes = cans.flatMap(c => c.children);
    const hits = raycaster.intersectObjects(meshes);
    let foundCan = null;
    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj && !obj.userData.food) obj = obj.parent;
      if (obj && !obj.userData.dimmed) foundCan = obj;
    }
    if (hoveredCan && hoveredCan !== foundCan) hoveredCan.scale.setScalar(1);
    hoveredCan = foundCan;
    if (hoveredCan) {
      hoveredCan.scale.setScalar(1.08);
      document.body.style.cursor = 'pointer';
    } else document.body.style.cursor = 'default';
  }

  let downPos = {x:0, y:0};
  function onPointerDown(e) { downPos = {x: e.clientX, y: e.clientY}; }
  function onPointerUp(e) {
    const dx = Math.abs(e.clientX - downPos.x);
    const dy = Math.abs(e.clientY - downPos.y);
    if (dx > 6 || dy > 6) return;
    if (focusedMode) return;
    raycaster.setFromCamera(mouse, camera);
    const meshes = cans.flatMap(c => c.children);
    const hits = raycaster.intersectObjects(meshes);
    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj && !obj.userData.food) obj = obj.parent;
      if (obj && !obj.userData.dimmed) focusCan(obj);
    }
  }
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointerup', onPointerUp);

  function animateCamera(toPos, toTarget, duration) {
    const fromPos = camera.position.clone();
    const fromTarget = controls.target.clone();
    const start = performance.now();
    function step() {
      const t = Math.min((performance.now() - start) / duration, 1);
      const e = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
      camera.position.lerpVectors(fromPos, toPos, e);
      controls.target.lerpVectors(fromTarget, toTarget, e);
      controls.update();
      if (t < 1) requestAnimationFrame(step);
    }
    step();
  }

  function focusCan(can) {
    selectedCan = can; focusedMode = true;
    controls.enabled = false;
    document.getElementById('back-btn').classList.add('show');
    cans.forEach(c => {
      if (c !== can) {
        c.userData.dimmed = true;
        c.children.forEach(ch => { if (ch.material) { ch.material.opacity = 0.15; ch.material.transparent = true; }});
      }
    });
    const targetPos = new THREE.Vector3(can.position.x * 0.3, can.position.y + 0.5, can.position.z + 4.5);
    animateCamera(targetPos, can.position, 800);
    showDetail(can.userData.food);
  }

  function unfocus() {
    if (!selectedCan) return;
    focusedMode = false;
    controls.enabled = true;
    document.getElementById('back-btn').classList.remove('show');
    document.getElementById('detail').classList.remove('show');
    cans.forEach(c => {
      c.userData.dimmed = false;
      c.children.forEach(ch => { if (ch.material) { ch.material.opacity = 1; ch.material.transparent = false; }});
      c.scale.setScalar(1);
    });
    selectedCan = null;
    animateCamera(CAM_INIT, CAM_LOOK, 800);
  }
  document.getElementById('detail-close').addEventListener('click', unfocus);
  document.getElementById('back-btn').addEventListener('click', unfocus);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') unfocus(); });

  function showDetail(food) {
    const sm = STAGE_META[food.stageKey];
    const accentHex = '#' + food.accent.toString(16).padStart(6,'0');
    const inner = document.getElementById('detail-inner');
    inner.innerHTML = `
      <div class="dh">
        <div class="dh-icon" style="background:${accentHex}">${sm.icon}</div>
        <div>
          <h2>${food.name}</h2>
          <p>${food.brand} · ${food.origin}</p>
          <span class="dh-tag" style="background:${accentHex}">${food.stage}</span>
        </div>
      </div>
      <div class="dn">
        <div class="dn-card"><span class="dn-label">粗蛋白</span><span class="dn-val" style="color:${accentHex}">${food.protein}</span></div>
        <div class="dn-card"><span class="dn-label">粗脂肪</span><span class="dn-val" style="color:${accentHex}">${food.fat}</span></div>
        <div class="dn-card"><span class="dn-label">阶段</span><span class="dn-val" style="color:${accentHex};font-size:.8rem">${sm.name}</span></div>
      </div>
      <div class="d-fit"><span>🎯</span><span>${food.fit}</span></div>
      <div class="d-pc">
        <div class="d-pros"><h4>✅ 优点</h4><ul>${food.pros.map(p=>`<li>${p}</li>`).join('')}</ul></div>
        <div class="d-cons"><h4>⚠️ 注意</h4><ul>${food.cons.map(c=>`<li>${c}</li>`).join('')}</ul></div>
      </div>`;
    setTimeout(() => document.getElementById('detail').classList.add('show'), 100);
  }

  // Filter
  function applyFilter(key) {
    cans.forEach(c => {
      const food = c.userData.food;
      const match = key === 'all' || food.stageKey === key ||
        (key === 'senior' && c.userData.row === 3 && c.userData.col < 2) ||
        (key === 'raw' && c.userData.row === 3 && c.userData.col >= 2);
      c.userData.dimmed = !match && !focusedMode;
      c.children.forEach(ch => {
        if (ch.material) {
          if (!focusedMode || c === selectedCan) {
            ch.material.opacity = match ? 1 : 0.15;
            ch.material.transparent = !match;
          }
        }
      });
    });
    document.querySelectorAll('.fp').forEach(p => p.classList.toggle('active', p.dataset.filter === key));
    document.querySelectorAll('.sl').forEach(s => s.classList.toggle('active', s.dataset.stage === key));
  }

  const filtersEl = document.getElementById('filters');
  const filterOptions = [
    {key:'all', label:'全部', color:'#d4a574'},
    {key:'kitten', label:'幼猫', color:STAGE_META.kitten.hex},
    {key:'adult', label:'成猫', color:STAGE_META.adult.hex},
    {key:'special', label:'功能型', color:STAGE_META.special.hex},
    {key:'senior', label:'老年', color:STAGE_META.senior.hex},
    {key:'raw', label:'冻干', color:STAGE_META.raw.hex},
    {key:'domestic', label:'国货', color:STAGE_META.domestic.hex}
  ];
  filtersEl.innerHTML = filterOptions.map(f =>
    `<button class="fp" data-filter="${f.key}"><span class="dot" style="background:${f.color}"></span>${f.label}</button>`
  ).join('');
  filtersEl.querySelectorAll('.fp').forEach(btn => btn.addEventListener('click', () => applyFilter(btn.dataset.filter)));

  const stageLabelsEl = document.getElementById('stage-labels');
  stageLabelsEl.innerHTML = ROW_LABELS.map(r => {
    const meta = STAGE_META[r.stageKey] || {hex:'#b07060'};
    return `<div class="sl" data-stage="${r.stageKey}" style="--c:${meta.hex}">${r.label}</div>`;
  }).join('');
  stageLabelsEl.querySelectorAll('.sl').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.stage === 'mixed') applyFilter('all');
    else applyFilter(btn.dataset.stage);
  }));

  // Animate
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.016;
    if (selectedCan && focusedMode) {
      selectedCan.position.y = selectedCan.userData.originalY + Math.sin(time * 1.5) * 0.08;
      selectedCan.rotation.y += 0.015;
    }
    if (hoveredCan && !focusedMode) hoveredCan.rotation.y += 0.01;
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  document.getElementById('loading').classList.add('hide');
  setTimeout(() => document.getElementById('loading').remove(), 800);
  console.log('🐱 3D博物馆已加载 · 20款猫粮 · 5层展架');
}

if (window.THREE && window.OrbitControls) {
  init();
} else {
  document.getElementById('loading-text').textContent = '等待Three.js加载...';
  window.addEventListener('load', () => {
    if (window.THREE && window.OrbitControls) init();
    else {
      document.getElementById('loading-text').style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').innerHTML = '⚠️ Three.js未能加载<br>请刷新页面或检查网络';
    }
  });
}


// Start app when libs are ready
waitForOrbit(init);


// Start app when DOM and libs are ready
init();
</script>

</body>
</html>
