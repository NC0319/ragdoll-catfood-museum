<style>

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#3d2a1c; font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
canvas { display:block; touch-action: none; position:fixed; top:0; left:0; z-index:2; }

/* ═══ Blob 装饰层（参考图1）═══ */
.blob-layer { position:fixed; inset:0; z-index:1; overflow:hidden; pointer-events:none; }
.blob {
  position:absolute;
  filter: blur(60px);
  opacity: 0.55;
  animation: blobFloat 18s ease-in-out infinite;
}
.blob-1 { top:-12%; left:-10%; width:55vw; height:55vw; background:radial-gradient(circle, #e9c46a 0%, #d4a574 60%, transparent 100%); border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%; animation-delay: 0s; }
.blob-2 { top:35%; right:-15%; width:50vw; height:50vw; background:radial-gradient(circle, #c4915c 0%, #a6703e 50%, transparent 100%); border-radius: 50% 60% 40% 50% / 60% 50% 50% 40%; opacity: 0.45; animation-delay: -6s; }
.blob-3 { bottom:-15%; left:25%; width:60vw; height:60vw; background:radial-gradient(circle, #d4756b 0%, #c98b5b 50%, transparent 100%); border-radius: 40% 50% 60% 50% / 50% 40% 60% 50%; opacity: 0.4; animation-delay: -12s; }
.blob-4 { top:10%; left:35%; width:30vw; height:30vw; background:radial-gradient(circle, #6f9bc9 0%, transparent 70%); border-radius: 50%; opacity: 0.3; animation-delay: -3s; }
@keyframes blobFloat {
  0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
  33% { transform: translate(40px, -30px) scale(1.08) rotate(8deg); }
  66% { transform: translate(-30px, 40px) scale(0.95) rotate(-8deg); }
}

/* ═══ 加载动画 ═══ */
#loading { position:fixed; inset:0; background:linear-gradient(135deg, #5a3a28 0%, #3d2a1c 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; color:#f0d9b0; transition: opacity .6s; }
#loading.hide { opacity:0; pointer-events:none; }
#loading .cat { font-size:64px; animation: bounce 1.4s infinite; }
#loading .msg { margin-top:20px; font-size:16px; letter-spacing:2px; text-align:center; padding:0 20px; }
#loading .err { display:none; margin-top:16px; padding:12px 24px; background:#c0392b; color:#fff; border-radius:8px; font-size:14px; max-width:80%; text-align:center; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

/* ═══ 顶部导航（参考图3）═══ */
.top-nav {
  position:fixed; top:0; left:0; right:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 28px; z-index:100;
}
.logo-pill {
  background: linear-gradient(135deg, #6f9bc9 0%, #8b6f9b 100%);
  color:white;
  border-radius:50px;
  padding:8px 18px 8px 12px;
  display:flex; align-items:center; gap:10px;
  font-weight:700; font-size:15px;
  box-shadow: 0 8px 24px rgba(111,155,201,0.35);
}
.logo-pill .emoji {
  width:32px; height:32px;
  background:rgba(255,255,255,0.2);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:18px;
}

.nav-tabs {
  display:flex; gap:6px;
  background: rgba(255, 235, 200, 0.15);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border:1px solid rgba(212,168,116,0.3);
  border-radius:50px;
  padding:6px;
}
.nav-tabs .tab {
  padding:8px 18px;
  border-radius:24px;
  color:#ffd9a0;
  font-size:13px;
  cursor:pointer;
  user-select:none;
  transition: all .25s;
  letter-spacing:1px;
}
.nav-tabs .tab:hover { color:#fff; }
.nav-tabs .tab.active {
  background: linear-gradient(135deg, #d4a574 0%, #e6b878 100%);
  color:#2a1a10;
  font-weight:600;
  box-shadow: 0 4px 12px rgba(212,168,116,0.4);
}

.nav-tools {
  display:flex; gap:8px;
}
.nav-tools button {
  width:40px; height:40px;
  border-radius:50%;
  background:rgba(255,235,200,0.15);
  border:1px solid rgba(212,168,116,0.3);
  color:#ffd9a0;
  font-size:16px;
  cursor:pointer;
  backdrop-filter:blur(12px);
  transition: all .25s;
}
.nav-tools button:hover {
  background:rgba(255,235,200,0.25);
  transform: translateY(-1px);
}

/* ═══ 底部筛选 ═══ */
.bottom-bar {
  position:fixed; bottom:24px; left:50%;
  transform: translateX(-50%);
  z-index:100;
  display:flex; flex-direction:column; gap:10px; align-items:center;
}
#filters { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:90vw; }
.fp {
  padding:8px 16px; border-radius:24px;
  background: rgba(255,235,200,0.15);
  color:#ffd9a0; border:1px solid rgba(212,168,116,0.4);
  cursor:pointer; font-size:13px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  transition: all .25s; letter-spacing:1px;
  user-select: none;
}
.fp:hover { background:rgba(255,235,200,0.25); border-color:#ffd9a0; }
.fp.active {
  background: linear-gradient(135deg, #d4a574 0%, #e6b878 100%);
  color:#2a1a10; font-weight:600;
  border-color: transparent;
  box-shadow: 0 4px 16px rgba(212,168,116,0.4);
}
.fp .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }

.bottom-stats {
  font-size:11px; color:#d4a574;
  letter-spacing:2px;
  background: rgba(255,235,200,0.1);
  padding:4px 12px;
  border-radius:20px;
  backdrop-filter:blur(12px);
}

/* ═══ 返回按钮 ═══ */
#back-btn {
  position:fixed; top:90px; left:28px;
  padding:8px 16px; border-radius:24px;
  background:rgba(255,235,200,0.15);
  color:#ffd9a0; border:1px solid rgba(212,168,116,0.4);
  font-size:13px; cursor:pointer;
  backdrop-filter:blur(12px); display:none; z-index:100;
  transition: all .25s;
}
#back-btn.show { display:block; }
#back-btn:hover { background:rgba(255,235,200,0.25); }

/* ═══ 紫色详情卡片（参考图3）═══ */
#detail {
  position:fixed; top:0; right:-520px;
  width:480px; max-width:92vw; height:100vh;
  background: linear-gradient(180deg, #4a3a6b 0%, #6f5b8b 50%, #4a3a6b 100%);
  border-radius:32px 0 0 32px;
  padding:24px;
  color:white;
  z-index:200;
  transition: right .55s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
  box-shadow: -20px 0 60px rgba(0,0,0,0.5);
  -webkit-overflow-scrolling: touch;
}
#detail.show { right:0; }

#detail-close {
  position:absolute; top:18px; right:18px;
  width:36px; height:36px;
  border-radius:50%;
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.2);
  color:white; font-size:18px;
  cursor:pointer;
  z-index:10;
  transition: all .25s;
}
#detail-close:hover { background:rgba(255,255,255,0.3); transform:rotate(90deg); }

.dc-hero {
  border-radius:24px;
  padding:30px 24px 24px;
  margin-bottom:20px;
  text-align:center;
  position:relative;
  box-shadow: 0 12px 32px rgba(0,0,0,0.25);
  min-height:240px;
  display:flex; flex-direction:column; justify-content:flex-end;
}
.dc-hero h2 {
  font-size:22px; font-weight:700;
  color:white;
  margin-bottom:4px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.dc-360 {
  position:absolute; top:14px; left:14px;
  width:56px; height:56px; border-radius:50%;
  background:rgba(255,255,255,0.25);
  border:1px solid rgba(255,255,255,0.4);
  color:white;
  font-size:10px;
  cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px;
  letter-spacing:0;
}
.dc-360 span { font-size:22px; }
.dc-stage-tag {
  position:absolute; top:18px; right:18px;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(12px);
  padding:4px 12px;
  border-radius:20px;
  font-size:11px;
  color:white;
  letter-spacing:1px;
}
.dc-brand-mark {
  position:absolute;
  top:50%; left:50%;
  transform: translate(-50%, -70%);
  font-size:96px;
  font-weight:900;
  color:rgba(255,255,255,0.25);
  letter-spacing:-4px;
  font-family: Georgia, serif;
  user-select:none;
}
.dc-price {
  font-size:42px; font-weight:700;
  color:white;
  margin-top:8px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.dc-add {
  position:absolute; bottom:18px; right:18px;
  width:56px; height:56px; border-radius:50%;
  background: rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.4);
  color:white;
  font-size:28px; font-weight:300;
  cursor:pointer;
  transition: all .25s;
}
.dc-add:hover { background: rgba(0,0,0,0.5); transform: scale(1.08); }

.dc-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
.dc-chip {
  padding:6px 14px;
  border-radius:16px;
  background:rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.85);
  font-size:11px;
  letter-spacing:1px;
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.15);
}

.dc-section {
  background:rgba(255,255,255,0.08);
  padding:14px 16px;
  border-radius:16px;
  margin-bottom:16px;
  border:1px solid rgba(255,255,255,0.1);
}
.dc-section h4 { font-size:13px; margin-bottom:6px; color:rgba(255,255,255,0.7); letter-spacing:1px; }
.dc-section p { font-size:13px; line-height:1.7; color:rgba(255,255,255,0.95); }

.dc-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.dc-card-dc {
  background:rgba(255,255,255,0.08);
  padding:14px 14px 12px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.1);
}
.dc-card-dc h4 { font-size:13px; margin-bottom:8px; letter-spacing:1px; }
.dc-card-dc:first-child h4 { color:#9ad29a; }
.dc-card-dc:last-child h4 { color:#f0c97a; }
.dc-card-dc ul { list-style:none; }
.dc-card-dc ul li {
  padding:3px 0; padding-left:14px;
  position:relative; font-size:12px; line-height:1.5;
  color:rgba(255,255,255,0.85);
}
.dc-card-dc ul li::before {
  content:"•"; position:absolute; left:0; color:rgba(255,255,255,0.5); font-weight:bold;
}

/* 提示条 */
.hint {
  position:fixed; top:90px; left:50%; transform:translateX(-50%);
  color:#d4a574; font-size:12px; letter-spacing:2px;
  background:rgba(255,235,200,0.08);
  padding:6px 16px; border-radius:20px;
  backdrop-filter:blur(8px); z-index:50;
}

/* ═══ 响应式 ═══ */
@media (max-width: 1024px) {
  .top-nav { padding:14px 18px; }
  .nav-tabs .tab { padding:7px 14px; font-size:12px; }
  .logo-pill { font-size:13px; padding:7px 14px 7px 10px; }
  .logo-pill .emoji { width:28px; height:28px; font-size:16px; }
  .hint { font-size:11px; }
}

@media (max-width: 768px) {
  .top-nav { padding:12px 14px; flex-wrap:wrap; gap:8px; }
  .logo-pill { order:1; }
  .nav-tabs { order:3; width:100%; justify-content:center; padding:4px; }
  .nav-tabs .tab { padding:6px 12px; font-size:11px; flex:1; text-align:center; }
  .nav-tools { order:2; }
  .nav-tools button { width:36px; height:36px; font-size:14px; }
  #back-btn { top:74px; left:14px; }
  .hint { display:none; }
  .bottom-bar { bottom:14px; }
  .fp { padding:6px 12px; font-size:12px; }
  .bottom-stats { font-size:10px; }

  #detail { width:100vw; max-width:100vw; height:78vh; top:auto; bottom:-100%; right:0; left:0; border-radius:24px 24px 0 0; }
  #detail.show { bottom:0; }
}

@media (max-width: 480px) {
  .top-nav { padding:10px 12px; }
  .logo-pill { font-size:12px; padding:6px 12px 6px 8px; gap:8px; }
  .logo-pill .emoji { width:24px; height:24px; font-size:14px; }
  .nav-tools button { width:32px; height:32px; font-size:13px; }
  #back-btn { top:64px; padding:6px 12px; font-size:12px; }
}

@media (max-height: 500px) and (orientation: landscape) {
  .top-nav { padding:8px 16px; }
  .nav-tabs .tab { padding:5px 10px; font-size:11px; }
  .hint { display:none; }
}

@supports (padding: max(0px)) {
  .top-nav { padding-top: max(14px, env(safe-area-inset-top)); }
  .bottom-bar { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  #detail { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
}
body.detail-open { overflow:hidden; touch-action:none; }

</style>

  function step(now) {
    var t = Math.min(1, (now - start) / 800);
    var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    camera.position.lerpVectors(fromPos, toPos, e);
    controls.target.lerpVectors(fromTarget, toTarget, e);
    controls.update();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ═══ 紫色卡片详情面板（参考图3）═══
function showDetail(food) {
  var meta = STAGE_META[food.stageKey] || STAGE_META.adult;
  var can = cans.find(function(c) { return c.userData.food.id === food.id; });
  var hex = '#' + food.accent.replace('#', '');
  
  // 大彩色卡片 hero
  var heroHtml = '<div class="dc-hero" style="background:' + hex + '">' +
    '<button class="dc-360" title="360° 旋转"><span>↻</span><br><small>360°</small></button>' +
    '<div class="dc-stage-tag">' + food.stage + '</div>' +
    '<div class="dc-brand-mark">' + food.brand.charAt(0) + '</div>' +
    '<h2>' + food.name + '</h2>' +
    '<div class="dc-price">' + food.price + '</div>' +
    '<button class="dc-add" title="添加到对比"><span>+</span></button>' +
  '</div>';
  
  // 规格 chips
  var chipsHtml = '<div class="dc-chips">' +
    '<span class="dc-chip" style="background:' + meta.color + '22; color:' + meta.color + '">' + food.stage + '</span>' +
    '<span class="dc-chip">' + food.origin + '</span>' +
    '<span class="dc-chip">蛋白 ' + food.protein + '</span>' +
    '<span class="dc-chip">脂肪 ' + food.fat + '</span>' +
  '</div>';
  
  // 适合
  var fitHtml = '<div class="dc-section"><h4>🎯 适合</h4><p>' + food.fit + '</p></div>';
  
  // 优点缺点（左右分列）
  var prosHtml = '<div class="dc-grid">' +
    '<div class="dc-card-dc"><h4>✓ 优点</h4><ul>' + food.pros.map(function(p){return '<li>'+p+'</li>'}).join('') + '</ul></div>' +
    '<div class="dc-card-dc"><h4>× 注意</h4><ul>' + food.cons.map(function(c){return '<li>'+c+'</li>'}).join('') + '</ul></div>' +
  '</div>';
  
  var html = heroHtml + chipsHtml + fitHtml + prosHtml;
  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail').classList.add('show');
  document.body.classList.add('detail-open');
}
function hideDetail() {
  document.getElementById('detail').classList.remove('show');
  document.body.classList.remove('detail-open');
}

document.getElementById('detail-close').addEventListener('click', hideDetail);
document.getElementById('back-btn').addEventListener('click', exitFocus);
window.addEventListener('keydown', function(e) { if (e.key === 'Escape') exitFocus(); });

var t0 = 0;
function animate() {
  requestAnimationFrame(animate);
  t0 += 0.016;
  raycaster.setFromCamera(pointer, camera);
  var intersects = raycaster.intersectObjects(cans, true);
  var newHover = null;
  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    while (obj && !obj.userData.isCan) obj = obj.parent;
    if (obj && obj.visible) { newHover = obj; break; }
  }
  if (newHover !== hoveredCan) {
    hoveredCan = newHover;
    canvas.style.cursor = hoveredCan ? 'pointer' : 'default';
  }
  if (selectedCan && focusedMode) {
    selectedCan.position.y = selectedCan.userData.originalY + Math.sin(t0 * 1.5) * 0.08;
    selectedCan.rotation.y += 0.015;
  }
  if (hoveredCan && !focusedMode && hoveredCan.visible) {
    hoveredCan.rotation.y += 0.01;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

var origX = camera.position.x, origY = camera.position.y, origZ = camera.position.z;
var dist = Math.sqrt(origX*origX + origY*origY + origZ*origZ);
camera.position.multiplyScalar(initialCameraDist / dist);
controls.update();

var resizeTimeout;
function performResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  var newDist = getCameraDistance();
  var curDist = camera.position.length();
  if (Math.abs(newDist - curDist) > 0.5) {
    camera.position.multiplyScalar(newDist / curDist);
    controls.update();
  }
}
window.addEventListener('resize', function() {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(performResize, 150);
});
window.addEventListener('orientationchange', function() { setTimeout(performResize, 300); });

setTimeout(function() {
  var loading = document.getElementById('loading');
  loading.classList.add('hide');
  setTimeout(function() { loading.remove(); }, 800);
}, 200);

console.log('🐱 v15 - UI 现代化升级');

})();
