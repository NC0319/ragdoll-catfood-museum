<html lang="zh-CN">
<head>

<title>布偶猫猫粮3D展览馆 · Ragdoll Cat Food 3D Museum</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#3d2a1c; font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
canvas { display:block; touch-action: none; }

#loading { position:fixed; inset:0; background:radial-gradient(ellipse at center,#5a3a28 0%,#3d2a1c 80%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; color:#f0d9b0; transition: opacity .6s; }
#loading.hide { opacity:0; pointer-events:none; }
#loading .cat { font-size:64px; animation: bounce 1.4s infinite; }
#loading .msg { margin-top:20px; font-size:16px; letter-spacing:2px; text-align:center; padding:0 20px; }
#loading .err { display:none; margin-top:16px; padding:12px 24px; background:#c0392b; color:#fff; border-radius:8px; font-size:14px; max-width:80%; text-align:center; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

#ui { position:fixed; inset:0; pointer-events:none; z-index:10; }
#ui > * { pointer-events:auto; }

#title { position:absolute; top:20px; left:20px; right:20px; text-align:center; color:#f0d9b0; }
#title h1 { font-size:24px; font-weight:300; letter-spacing:6px; color:#ffd9a0; text-shadow: 0 2px 12px rgba(255,200,150,0.5); }
#title p { font-size:11px; letter-spacing:4px; color:#d4a574; margin-top:4px; }

#filters { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:90%; }
.fp { padding:8px 16px; border-radius:20px; background:rgba(255,235,200,0.15); color:#f0d9b0; border:1px solid rgba(212,168,116,0.4); cursor:pointer; font-size:13px; backdrop-filter: blur(8px); transition: all .25s; letter-spacing:1px; -webkit-tap-highlight-color: transparent; user-select: none; }
.fp:hover { background:rgba(255,235,200,0.25); border-color:#ffd9a0; }
.fp.active { background:#d4a574; color:#2a1a10; font-weight:600; }
.fp .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }

#hint { position:absolute; top:80px; left:50%; transform:translateX(-50%); color:#d4a574; font-size:12px; letter-spacing:1px; }

#back-btn { position:absolute; top:20px; left:20px; padding:6px 14px; background:rgba(255,235,200,0.15); color:#ffd9a0; border:1px solid rgba(212,168,116,0.4); border-radius:16px; cursor:pointer; font-size:13px; display:none; backdrop-filter: blur(8px); user-select: none; }
#back-btn.show { display:block; }

#detail { position:fixed; top:0; right:-440px; width:420px; max-width:90vw; height:100vh; background:linear-gradient(135deg, rgba(60,40,28,0.95), rgba(80,50,30,0.95)); backdrop-filter: blur(16px); border-left:1px solid rgba(212,168,116,0.3); padding:30px; color:#e8d9c0; z-index:100; transition: right .5s cubic-bezier(.4,0,.2,1); overflow-y:auto; -webkit-overflow-scrolling: touch; }
#detail.show { right:0; box-shadow: -10px 0 40px rgba(0,0,0,0.5); }
#detail-close { position:absolute; top:15px; right:15px; width:32px; height:32px; border-radius:50%; background:rgba(212,168,116,0.2); border:none; color:#ffd9a0; font-size:18px; cursor:pointer; }
#detail-close:hover { background:rgba(212,168,116,0.4); }
#detail h2 { color:#ffd9a0; font-size:22px; margin-bottom:4px; }
#detail .brand { color:#d4a574; font-size:13px; margin-bottom:20px; }
#detail .stage { display:inline-block; padding:4px 12px; border-radius:12px; font-size:12px; margin-bottom:16px; }
#detail .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
#detail .stat { background:rgba(212,168,116,0.12); padding:10px; border-radius:8px; border:1px solid rgba(212,168,116,0.2); }
#detail .stat .lbl { font-size:11px; color:#b88a5a; }
#detail .stat .val { font-size:16px; color:#ffd9a0; margin-top:4px; }
#detail .fit { background:rgba(212,168,116,0.1); padding:12px; border-radius:8px; font-size:13px; line-height:1.6; margin:14px 0; border-left:3px solid #d4a574; }
#detail .pros, #detail .cons { margin:14px 0; }
#detail .pros h4 { font-size:13px; margin-bottom:8px; color:#9ad29a; }
#detail .cons h4 { font-size:13px; margin-bottom:8px; color:#d4a574; }
#detail ul { list-style:none; }
#detail ul li { padding:4px 0; padding-left:18px; position:relative; font-size:13px; }
#detail ul li::before { content:"·"; position:absolute; left:0; color:#d4a574; font-weight:bold; }

#stage-labels { position:absolute; left:18px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; }
.stage-label { padding:6px 10px; border-radius:8px; background:rgba(255,235,200,0.12); font-size:11px; color:#ffd9a0; letter-spacing:1px; backdrop-filter:blur(8px); border-left:3px solid #d4a574; user-select: none; }

#stats-badge { position:absolute; bottom:100px; right:20px; color:#b88a5a; font-size:11px; letter-spacing:1px; text-align:right; }

/* ═══ 响应式断点 ═══ */

/* 大屏桌面（默认就是桌面布局，但显式声明） */
@media (min-width: 1280px) {
  #title h1 { font-size: 26px; letter-spacing: 8px; }
  #stats-badge { font-size: 12px; }
}

/* 平板（768-1024）*/
@media (max-width: 1024px) {
  #title h1 { font-size: 20px; letter-spacing: 4px; }
  #title p { font-size: 10px; }
  #hint { font-size: 11px; top: 70px; }
  #filters { bottom: 20px; gap: 8px; }
  .fp { padding: 7px 14px; font-size: 12px; }
  #stage-labels { left: 12px; }
  .stage-label { font-size: 10px; padding: 5px 8px; }
  #stats-badge { font-size: 10px; right: 12px; bottom: 90px; }
  #detail { width: 380px; padding: 24px; }
}

/* 手机横屏（480-768）*/
@media (max-width: 768px) {
  #title { top: 12px; }
  #title h1 { font-size: 16px; letter-spacing: 3px; }
  #title p { font-size: 9px; letter-spacing: 2px; }
  #hint { font-size: 10px; top: 56px; padding: 0 12px; max-width: 90vw; }
  #back-btn { top: 12px; left: 12px; padding: 5px 12px; font-size: 12px; }
  
  /* 阶段标签改成顶部水平条 */
  #stage-labels {
    top: 88px;
    left: 50%;
    transform: translateX(-50%);
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 92vw;
    gap: 6px;
  }
  .stage-label {
    font-size: 10px;
    padding: 4px 8px;
  }
  
  #filters {
    bottom: 12px;
    gap: 6px;
    max-width: 96vw;
  }
  .fp {
    padding: 6px 11px;
    font-size: 11px;
    border-radius: 16px;
  }
  .fp .dot { width: 6px; height: 6px; margin-right: 4px; }
  
  #stats-badge {
    font-size: 9px;
    bottom: 70px;
    right: 12px;
  }
  
  /* 详情面板：手机端从底部拉起（70% 高度）*/
  #detail {
    width: 100vw;
    max-width: 100vw;
    height: 75vh;
    top: auto;
    bottom: -100%;
    right: 0;
    left: 0;
    border-left: none;
    border-top: 1px solid rgba(212,168,116,0.3);
    border-radius: 20px 20px 0 0;
    transition: bottom .5s cubic-bezier(.4,0,.2,1);
    padding: 24px 20px;
  }
  #detail.show { bottom: 0; }
  #detail-close {
    top: 12px;
    right: 16px;
    width: 28px;
    height: 28px;
  }
  #detail h2 { font-size: 18px; }
  #detail .brand { font-size: 12px; margin-bottom: 12px; }
  #detail .stats { gap: 8px; }
  #detail .stat .val { font-size: 14px; }
  #detail .fit { font-size: 12px; padding: 10px; }
  #detail .pros h4, #detail .cons h4 { font-size: 12px; }
  #detail ul li { font-size: 12px; }
}

/* 小屏手机（<480）*/
@media (max-width: 480px) {
  #title h1 { font-size: 14px; letter-spacing: 2px; }
  #title p { font-size: 8px; letter-spacing: 1.5px; }
  #hint { font-size: 9px; top: 50px; }
  #stage-labels { top: 78px; }
  .stage-label { font-size: 9px; padding: 3px 6px; }
  #filters { bottom: 10px; gap: 4px; }
  .fp { padding: 5px 9px; font-size: 10px; }
  #stats-badge { font-size: 8px; }
  #detail { height: 80vh; padding: 20px 16px; }
  #detail h2 { font-size: 16px; }
}

/* 安全区域（刘海/导航条） */
@supports (padding: max(0px)) {
  #title { padding-top: max(8px, env(safe-area-inset-top)); }
  #filters { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #detail { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
}

/* 横屏特殊处理 */
@media (max-height: 500px) and (orientation: landscape) {
  #title { top: 6px; }
  #title h1 { font-size: 14px; }
  #title p { display: none; }
  #hint { display: none; }
  #stage-labels { top: 36px; }
  #filters { bottom: 6px; }
  #detail { height: 92vh; }
}

/* 防止 body 在移动端滚动 */
body.detail-open { overflow: hidden; touch-action: none; }

</style>

  { y: 5.65, stageKey: 'adult',    label: '成猫期',     foodIds: [5, 6, 7, 8] },
  { y: 4.1,  stageKey: 'special',  label: '功能型',     foodIds: [9, 10, 11, 12] },
  { y: 2.55, stageKey: 'mixed',    label: '老年 · 冻干', foodIds: [13, 14, 15, 16] },
  { y: 1.0,  stageKey: 'domestic', label: '国货精选',   foodIds: [17, 18, 19, 20] }
];

var COL_X = [-4.8, -1.6, 1.6, 4.8];
var SHELF_Z = -6.35;
var SHELF_WIDTH = 12.6;
var SHELF_DEPTH = 1.5;
var SHELF_THICKNESS = 0.22;
var CAN_RADIUS = 0.62;
var CAN_HEIGHT = 1.35;

var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
if (THREE.ACESFilmicToneMapping) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.4;
}

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x3d2a1c);
scene.fog = new THREE.Fog(0x3d2a1c, 30, 70);

var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 4.8, 18);
camera.lookAt(0, 4.15, SHELF_Z);

var ambient = new THREE.AmbientLight(0xfff0d8, 0.7);
scene.add(ambient);

var dirLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
dirLight.position.set(5, 12, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.left = -12;
dirLight.shadow.camera.right = 12;
dirLight.shadow.camera.top = 12;
dirLight.shadow.camera.bottom = -4;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 30;
scene.add(dirLight);

var hemi = new THREE.HemisphereLight(0xffe4b5, 0x2a1a10, 0.6);
scene.add(hemi);

for (var li = 0; li < 4; li++) {
  var spot = new THREE.SpotLight(0xfff0d0, 1.5, 25, Math.PI / 4, 0.7, 1.5);
  spot.position.set(-7 + li * 4.6, 9, 4);
  spot.target.position.set(-7 + li * 4.6, 4, SHELF_Z);
  scene.add(spot);
  scene.add(spot.target);
}

var floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 30),
  new THREE.MeshStandardMaterial({ color: 0x4a3220, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

var carpet = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 5),
  new THREE.MeshStandardMaterial({ color: 0x9c6a44, roughness: 0.85 })
);
carpet.rotation.x = -Math.PI / 2;
carpet.position.set(0, 0.01, -3);
carpet.receiveShadow = true;
scene.add(carpet);

var wall = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 15),
  new THREE.MeshStandardMaterial({ color: 0x5a3a28, roughness: 0.85 })
);
wall.position.set(0, 7.5, -8);
wall.receiveShadow = true;
scene.add(wall);

var shelfGroup = new THREE.Group();
scene.add(shelfGroup);

var shelfWoodMat = new THREE.MeshStandardMaterial({ color: 0xa6703e, roughness: 0.6, metalness: 0.05 });
var stageLabelsEl = document.getElementById('stage-labels');

SHELF_LAYOUT.forEach(function(layer, layerIdx) {
  var board = new THREE.Mesh(
    new THREE.BoxGeometry(SHELF_WIDTH, SHELF_THICKNESS, SHELF_DEPTH),
    shelfWoodMat
  );
  board.position.set(0, layer.y, SHELF_Z);
  board.castShadow = true;
  board.receiveShadow = true;
  shelfGroup.add(board);

  var leftCol = new THREE.Mesh(new THREE.BoxGeometry(0.4, layer.y, SHELF_DEPTH), shelfWoodMat);
  leftCol.position.set(-SHELF_WIDTH / 2 + 0.2, layer.y / 2, SHELF_Z);
  leftCol.castShadow = true;
  leftCol.receiveShadow = true;
  shelfGroup.add(leftCol);

  var rightCol = new THREE.Mesh(new THREE.BoxGeometry(0.4, layer.y, SHELF_DEPTH), shelfWoodMat);
  rightCol.position.set(SHELF_WIDTH / 2 - 0.2, layer.y / 2, SHELF_Z);
  rightCol.castShadow = true;
  rightCol.receiveShadow = true;
  shelfGroup.add(rightCol);

  if (layerIdx === 0) {
    var plaque = new THREE.Mesh(
      new THREE.BoxGeometry(8, 0.8, 0.15),
      new THREE.MeshStandardMaterial({ color: 0xe6b878, roughness: 0.3, metalness: 0.7, emissive: 0x6a4a20, emissiveIntensity: 0.2 })
    );
    plaque.position.set(0, layer.y + 1.2, SHELF_Z);
    plaque.castShadow = true;
    shelfGroup.add(plaque);
  }

  var sl = document.createElement('div');
  sl.className = 'stage-label';
  sl.dataset.stage = layer.stageKey;
  var meta = STAGE_META[layer.stageKey] || {color:'#d4a574'};
  sl.style.borderLeftColor = meta.color;
  sl.textContent = layer.label;
  stageLabelsEl.appendChild(sl);
});

var cans = [];
var raycaster = new THREE.Raycaster();
var pointer = new THREE.Vector2();
var hoveredCan = null;
var selectedCan = null;
var focusedMode = false;

// 移动端相机距离动态调整
function getCameraDistance() {
  var w = window.innerWidth;
  if (w < 480) return 28;        // 小屏手机拉远
  if (w < 768) return 24;        // 手机
  if (w < 1024) return 20;       // 平板
  return 18;                      // 桌面
}
var initialCameraDist = getCameraDistance();

FOODS.forEach(function(food) {
  var layer = null, colIdx = -1;
  for (var i = 0; i < SHELF_LAYOUT.length; i++) {
    var ci = SHELF_LAYOUT[i].foodIds.indexOf(food.id);
    if (ci !== -1) { layer = SHELF_LAYOUT[i]; colIdx = ci; break; }
  }
  if (!layer) return;

  var group = new THREE.Group();
  group.position.set(COL_X[colIdx], layer.y + SHELF_THICKNESS / 2 + CAN_HEIGHT / 2, SHELF_Z);

  var bodyColor = parseInt(food.accent.replace('#',''), 16);
  
  var lidMat = new THREE.MeshStandardMaterial({
    color: 0x5a4030, roughness: 0.35, metalness: 0.8,
    emissive: 0x2a1a10, emissiveIntensity: 0.15
  });
  var lid = new THREE.Mesh(
    new THREE.CylinderGeometry(CAN_RADIUS * 0.95, CAN_RADIUS * 0.95, 0.12, 32), lidMat
  );
  lid.position.y = CAN_HEIGHT / 2 - 0.06;
  lid.castShadow = true;
  group.add(lid);

  var bodyMat = new THREE.MeshStandardMaterial({
    color: bodyColor, roughness: 0.5, metalness: 0.15,
    emissive: bodyColor, emissiveIntensity: 0.08
  });
  var body = new THREE.Mesh(
    new THREE.CylinderGeometry(CAN_RADIUS, CAN_RADIUS, CAN_HEIGHT - 0.12, 32), bodyMat
  );
  body.position.y = -0.06 / 2;
  body.castShadow = true;
  group.add(body);

  var bandMat = new THREE.MeshStandardMaterial({
    color: 0xf5ead0, roughness: 0.6, metalness: 0.05
  });
  var band = new THREE.Mesh(
    new THREE.CylinderGeometry(CAN_RADIUS * 1.005, CAN_RADIUS * 1.005, 0.5, 32), bandMat
  );
  band.position.y = 0.05;
  group.add(band);

  var labelCanvas = document.createElement('canvas');
  labelCanvas.width = 512;
  labelCanvas.height = 128;
  var ctx = labelCanvas.getContext('2d');
  ctx.fillStyle = '#f5ead0';
  ctx.fillRect(0, 0, 512, 128);
  ctx.fillStyle = '#c4915c';
  ctx.fillRect(0, 0, 512, 4);
  ctx.fillRect(0, 124, 512, 4);
  ctx.fillStyle = '#3d2e25';
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  var brandText = food.brand.split(' ')[0] || food.brand;
  ctx.fillText(brandText.substring(0, 6), 256, 90);
  var labelTex = new THREE.CanvasTexture(labelCanvas);
  if (THREE.SRGBColorSpace) labelTex.colorSpace = THREE.SRGBColorSpace;
  var labelMat = new THREE.MeshBasicMaterial({ map: labelTex });
  labelMat.side = THREE.DoubleSide;
  var labelCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(CAN_RADIUS * 1.01, CAN_RADIUS * 1.01, 0.5, 32, 1, true), labelMat
  );
  labelCyl.position.y = 0.05;
  group.add(labelCyl);

  var ringColor = STAGE_META[food.stageKey] ? STAGE_META[food.stageKey].hex : 0xd4a574;
  var ringMat = new THREE.MeshStandardMaterial({
    color: ringColor, roughness: 0.4, metalness: 0.3,
    emissive: ringColor, emissiveIntensity: 0.3
  });
  var ring = new THREE.Mesh(
    new THREE.TorusGeometry(CAN_RADIUS * 0.92, 0.04, 8, 32), ringMat
  );
  ring.position.y = CAN_HEIGHT / 2 - 0.18;
  ring.rotation.x = Math.PI / 2;
  group.add(ring);

  group.userData = {
    food: food, originalY: group.position.y, isCan: true,
    stageKey: layer.stageKey,
    bodyMat: bodyMat, labelMat: labelMat, bandMat: bandMat, lidMat: lidMat
  };

  cans.push(group);
  shelfGroup.add(group);
});

var controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(originalCameraTarget);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 38;
controls.maxPolarAngle = Math.PI / 2 + 0.1;
controls.minPolarAngle = 0.3;
controls.enablePan = IS_TOUCH;  // 桌面禁用平移保持简洁，移动端启用平移

// 触摸配置（必填）
if (IS_TOUCH) {
  controls.touches = {
    ONE: THREE.TOUCH.ROTATE,
    TWO: THREE.TOUCH.DOLLY_PAN
  };
}


var FILTERS = [
  { key: 'all', label: '全部' },
  { key: 'kitten', label: '幼猫' },
  { key: 'adult', label: '成猫' },
  { key: 'special', label: '功能型' },
  { key: 'senior', label: '老年' },
  { key: 'raw', label: '冻干' },
  { key: 'domestic', label: '国货' }
];

var filtersEl = document.getElementById('filters');
FILTERS.forEach(function(f) {
  var btn = document.createElement('button');
  btn.className = 'fp' + (f.key === 'all' ? ' active' : '');
  btn.dataset.filter = f.key;
  var meta = STAGE_META[f.key];
  btn.innerHTML = '<span class="dot" style="background:' + (meta ? meta.color : '#d4a574') + '"></span>' + f.label;
  btn.addEventListener('click', function() { applyFilter(f.key); });
  filtersEl.appendChild(btn);
});

function applyFilter(key) {
  document.querySelectorAll('.fp').forEach(function(b) {
    b.classList.toggle('active', b.dataset.filter === key);
  });
  cans.forEach(function(can) {
    var sk = can.userData.stageKey;
    var fsk = can.userData.food.stageKey;
    var visible = (key === 'all') ||
                  (sk === key) ||
                  (key === 'senior' && sk === 'mixed' && fsk === 'senior') ||
                  (key === 'raw' && sk === 'mixed' && fsk === 'raw');
    can.visible = visible;
  });
}
applyFilter('all');

// 桌面端 click，移动端 tap（click 在移动端也能触发，但会有 300ms 延迟 → 禁用缩放即可）
canvas.addEventListener('pointermove', function(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

canvas.addEventListener('click', function() {
  if (!hoveredCan) { exitFocus(); return; }
  if (selectedCan === hoveredCan) return;
  focusOnCan(hoveredCan);
});

function focusOnCan(can) {
  selectedCan = can;
  focusedMode = true;
  document.getElementById('back-btn').classList.add('show');
  cans.forEach(function(c) {
    if (c !== can) {
      c.userData.labelMat.opacity = 0.2; c.userData.labelMat.transparent = true;
      c.userData.bodyMat.opacity = 0.4; c.userData.bodyMat.transparent = true;
      c.userData.bandMat.opacity = 0.4; c.userData.bandMat.transparent = true;
      c.userData.lidMat.opacity = 0.4; c.userData.lidMat.transparent = true;
    }
  });
  var targetPos = new THREE.Vector3(can.position.x + 3, can.position.y + 1.5, can.position.z + 4);
  var targetLook = new THREE.Vector3(can.position.x, can.position.y, can.position.z);
  animateCamera(targetPos, targetLook);
  showDetail(can.userData.food);
}

function exitFocus() {
  if (!focusedMode) return;
  focusedMode = false;
  selectedCan = null;
  document.getElementById('back-btn').classList.remove('show');
  cans.forEach(function(c) {
    c.userData.labelMat.opacity = 1; c.userData.labelMat.transparent = false;
    c.userData.bodyMat.opacity = 1; c.userData.bodyMat.transparent = false;
    c.userData.bandMat.opacity = 1; c.userData.bandMat.transparent = false;
    c.userData.lidMat.opacity = 1; c.userData.lidMat.transparent = false;
  });
  animateCamera(originalCameraPos, originalCameraTarget);
  hideDetail();
}

function animateCamera(toPos, toTarget) {
  var fromPos = camera.position.clone();
  var fromTarget = controls.target.clone();
  var start = performance.now();
  function step(now) {
    var t = Math.min(1, (now - start) / 800);
    var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    camera.position.lerpVectors(fromPos, toPos, e);
    controls.target.lerpVectors(fromTarget, toTarget, e);
    controls.update();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function showDetail(food) {
  var meta = STAGE_META[food.stageKey] || STAGE_META.adult;
  var html = '<h2>' + food.name + '</h2>' +
    '<div class="brand">' + food.brand + ' · ' + food.origin + '</div>' +
    '<span class="stage" style="background:' + meta.color + '33; color:' + meta.color + '; border:1px solid ' + meta.color + '66;">' + food.stage + '</span>' +
    '<div class="stats">' +
      '<div class="stat"><div class="lbl">粗蛋白</div><div class="val">' + food.protein + '</div></div>' +
      '<div class="stat"><div class="lbl">粗脂肪</div><div class="val">' + food.fat + '</div></div>' +
    '</div>' +
    '<div class="fit">🎯 <strong>适合：</strong>' + food.fit + '</div>' +
    '<div class="pros"><h4>✓ 优点</h4><ul>' +
      food.pros.map(function(p) { return '<li>' + p + '</li>'; }).join('') +
    '</ul></div>' +
    '<div class="cons"><h4>× 注意</h4><ul>' +
      food.cons.map(function(c) { return '<li>' + c + '</li>'; }).join('') +
    '</ul></div>';
  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail').classList.add('show');
  document.body.classList.add('detail-open');
}
function hideDetail() {
  document.getElementById('detail').classList.remove('show');
  document.body.classList.remove('detail-open');
}

document.getElementById('detail-close').addEventListener('click', hideDetail);
document.getElementById('back-btn').addEventListener('click', exitFocus);
window.addEventListener('keydown', function(e) { if (e.key === 'Escape') exitFocus(); });

var t0 = 0;
function animate() {
  requestAnimationFrame(animate);
  t0 += 0.016;

  raycaster.setFromCamera(pointer, camera);
  var intersects = raycaster.intersectObjects(cans, true);
  var newHover = null;
  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    while (obj && !obj.userData.isCan) obj = obj.parent;
    if (obj && obj.visible) { newHover = obj; break; }
  }
  if (newHover !== hoveredCan) {
    hoveredCan = newHover;
    canvas.style.cursor = hoveredCan ? 'pointer' : 'default';
  }

  if (selectedCan && focusedMode) {
    selectedCan.position.y = selectedCan.userData.originalY + Math.sin(t0 * 1.5) * 0.08;
    selectedCan.rotation.y += 0.015;
  }
  if (hoveredCan && !focusedMode && hoveredCan.visible) {
    hoveredCan.rotation.y += 0.01;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

// 应用初始相机距离
var origX = camera.position.x, origY = camera.position.y, origZ = camera.position.z;
var dist = Math.sqrt(origX*origX + origY*origY + origZ*origZ);
camera.position.multiplyScalar(initialCameraDist / dist);
controls.update();

// 响应式 resize
var resizeTimeout;
function performResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  var newDist = getCameraDistance();
  var curDist = camera.position.length();
  if (Math.abs(newDist - curDist) > 0.5) {
    camera.position.multiplyScalar(newDist / curDist);
    controls.update();
  }
}
window.addEventListener('resize', function() {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(performResize, 150);
});
window.addEventListener('orientationchange', function() {
  setTimeout(performResize, 300);
});

setTimeout(function() {
  var loading = document.getElementById('loading');
  loading.classList.add('hide');
  setTimeout(function() { loading.remove(); }, 800);
}, 200);

console.log('🐱 v13 - 响应式适配 + 触摸支持');

})();
</script>
